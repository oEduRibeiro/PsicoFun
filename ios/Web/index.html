<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>PsicoFun</title>
<style>
/* VOICE: concentrado e direto, como o caderno de prova num dia de concurso.
   IDEA: a folha de questões do psicotécnico — células numeradas, alternativas com letra, gabarito dobrado (o olho).
   PICTURE: a própria questão gerada, grande, no centro; na entrada, uma matriz 3×3 real com o "?".
   COLOUR and TYPE: papel branco e tinta grafite; vermelho-bombeiro só para ação e erro; verde só para acerto. Archivo.
   LAYOUT: uma coluna de 760px; topo fixo com progresso; alternativas em grade que vira 3+2 no celular. */
:root{color-scheme:light dark;
  --bg:light-dark(#eef0f2,#0f1114);--paper:light-dark(#ffffff,#191c21);--cell:light-dark(#ffffff,#1f2329);
  --ink:light-dark(#15171b,#eceae4);--muted:light-dark(#5b616b,#9aa1ab);--line:light-dark(#d6d9de,#2e333b);
  --acc:light-dark(#c8102e,#ff5c63);--accInk:#fff;--ok:light-dark(#127a3a,#4ade80);--okBg:light-dark(#e3f4e8,#143222);
  --bad:light-dark(#c8102e,#ff6b70);--badBg:light-dark(#fbe6e8,#3a1a1d);--gray:light-dark(#a1a7b0,#6b727c);--soft:light-dark(#f5f6f8,#22262c)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.topin{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:8px 16px}
.brand{font-weight:800;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;margin-right:auto;font-size:15px}
.brand svg{width:22px;height:22px}
.nav{display:flex;gap:2px}
.nav button{border:0;background:none;padding:10px 12px;min-height:44px;border-radius:10px;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer}
.nav button.on{color:var(--ink);background:var(--soft)}
main{max-width:760px;margin:0 auto;padding:20px 16px 72px}
h1{font-size:clamp(30px,6vw,44px);line-height:1.05;letter-spacing:-.02em;margin:0 0 10px;font-weight:800;text-wrap:balance}
h1.pg{font-size:clamp(28px,5vw,36px)}
h2{font-size:19px;margin:0 0 10px;font-weight:800;letter-spacing:-.01em}
h2.sec{margin:28px 0 12px}
.lead{color:var(--muted);margin:0 0 14px;max-width:62ch}
.meta{font-weight:600;margin:0}.muted{color:var(--muted)}.small{font-size:14px;margin-top:-4px}
.row{display:flex;gap:8px;align-items:center}.row.sp{justify-content:space-between}.row.end{justify-content:flex-end;margin-top:16px}.row.wrap{flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--paper);min-height:44px;padding:9px 16px;border-radius:12px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn.pri{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.danger{color:var(--bad);border-color:currentColor}
.btn.ghost{background:transparent}.btn.sm{min-height:36px;padding:6px 12px;font-size:14px}
.btn.big{width:100%;min-height:52px;font-size:17px;margin-top:6px}
.btn:disabled{opacity:.4;cursor:default}
.btn:focus-visible,.opt:focus-visible,.chip:focus-visible,.mode:focus-visible,.nav button:focus-visible,.rh:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;flex:none}
/* figuras */
.fg{display:block;width:100%;height:auto}
.fg .sh{stroke:var(--ink);stroke-width:2.2;stroke-linejoin:round}
.fg .f0{fill:var(--cell)}.fg .f1{fill:var(--gray)}.fg .f2{fill:var(--ink)}
.fg .ln{stroke:var(--ink);stroke-width:3;stroke-linecap:round}.fg .mk{fill:var(--ink)}
/* início */
.hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:24px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:clamp(18px,4vw,32px)}
.heroFig{justify-self:end;width:100%;max-width:270px}
.mgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.mgrid .c,.stim .c{background:var(--cell);border:1.5px solid var(--line);border-radius:8px;aspect-ratio:1;position:relative;display:grid;place-items:center}
.c.q{border:2px dashed var(--acc);color:var(--acc);font-weight:800;font-size:clamp(22px,5vw,32px)}
.cont{margin-top:14px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:var(--ink);color:var(--paper);border-radius:16px;padding:14px 16px}
.cont b{display:block}.cont span{opacity:.75;font-size:14px}.cont .btn.ghost{color:var(--paper);border-color:rgba(255,255,255,.35)}.cont .btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.modes{display:grid;gap:10px}
.mode{display:flex;gap:14px;align-items:center;text-align:left;width:100%;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:12px 14px;cursor:pointer;transition:border-color .15s,transform .15s}
@media(hover:hover){.mode:hover{border-color:var(--ink)}}.mode.dis{opacity:.55}
.mfig{width:64px;flex:none;background:var(--cell);border:1.5px solid var(--line);border-radius:10px;padding:4px}
.mtx b{display:block;font-size:17px}.mtx>span{display:block;color:var(--muted);font-size:14px;line-height:1.4}
.fb{display:inline-flex;align-items:center;gap:6px;font-style:normal;font-size:13px;font-weight:600;margin-top:6px;margin-right:10px;color:var(--muted)}
.fb .ico{width:16px;height:16px}.fb-end,.fb-off{color:var(--acc)}
.hint{margin-top:16px;color:var(--muted);font-size:15px}
/* formulário */
.back{border:0;background:none;color:var(--muted);font-weight:600;padding:8px 0;min-height:44px;cursor:pointer;margin-bottom:4px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:14px}
.form{display:grid;gap:18px}
.fld{display:grid;gap:8px}.fld>span{font-weight:600}.fld b{color:var(--acc);font-size:18px;margin-left:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--paper);min-height:42px;padding:7px 14px;border-radius:999px;font-weight:600;font-size:15px;cursor:pointer}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
input[type=range]{width:100%;accent-color:var(--acc);height:32px}
.note{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:14px;margin:0}
/* questão */
.qtop{position:sticky;top:0;z-index:4;background:var(--bg);margin:-14px -16px 6px;padding:10px 16px 6px}
.qtop .row.sp{gap:8px}.qtop .row{gap:4px}
body.quiz .top{display:none}body.quiz main{padding-top:14px;padding-bottom:24px}
.prog{height:4px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:8px}.prog i{display:block;height:100%;background:var(--acc);transition:width .3s}
.qn{font-weight:800;font-size:18px;white-space:nowrap}.qn small{color:var(--muted);font-weight:500;font-size:14px;margin-left:1px}
.tag{font-size:13px;font-weight:600;color:var(--muted);background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:3px 10px;white-space:nowrap}
.tm{font-variant-numeric:tabular-nums;font-weight:700;min-width:46px;text-align:right}.tm.warn{color:var(--acc)}
.x{border:0;background:none;width:40px;height:40px;border-radius:10px;cursor:pointer;color:var(--muted);font-size:18px}
.prompt{font-size:clamp(19px,4.2vw,24px);line-height:1.2;margin:6px 0 14px;text-wrap:balance}.prompt.sm{font-size:17px}
.stim{display:grid;gap:8px;margin:0 auto 18px}
.stim.seq{grid-template-columns:repeat(6,minmax(0,1fr))}
.stim.mat{grid-template-columns:repeat(3,minmax(0,1fr));width:min(100%,330px,38svh)}
.stim.ana{grid-template-columns:minmax(0,1fr) 14px minmax(0,1fr) 22px minmax(0,1fr) 14px minmax(0,1fr);align-items:center;max-width:520px}
.stim.model{width:min(170px,26svh)}
.stim .op{text-align:center;font-weight:800;color:var(--muted)}
.stim .c i{position:absolute;top:3px;left:6px;font-style:normal;font-size:12px;font-weight:700;color:var(--muted)}
.stim.seq .c,.stim.mat .c,.stim.ana .c{padding:4px}.stim .c.big{padding:16px}
.opts{display:grid;gap:10px;grid-template-columns:repeat(5,minmax(0,1fr))}
.opts.n8{grid-template-columns:repeat(4,minmax(0,1fr));width:min(100%,520px,52svh);margin:0 auto}
.opt{position:relative;background:var(--cell);border:2px solid var(--line);border-radius:12px;padding:22px 6px 6px;cursor:pointer;transition:border-color .12s,transform .12s}
.opt b{position:absolute;top:4px;left:8px;font-size:13px;color:var(--muted)}
@media(hover:hover){.opt:hover{border-color:var(--muted)}}
.opt.sel{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink)}
.opt.sel b{color:var(--ink)}
.opt.ok{border-color:var(--ok);box-shadow:0 0 0 2px var(--ok);background:var(--okBg)}.opt.ok b{color:var(--ok)}
.opt.bad{border-color:var(--bad);box-shadow:0 0 0 2px var(--bad);background:var(--badBg)}.opt.bad b{color:var(--bad)}
.opt[aria-disabled=true]{cursor:default}
.qbar{position:sticky;bottom:0;z-index:3;display:flex;gap:10px;justify-content:flex-end;align-items:center;margin:14px -16px 0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--line)}
.qbar .muted{margin-right:auto;font-size:14px;line-height:1.25}
.qbar .btn{min-height:48px}.qbar .btn.pri{min-width:130px}
.eye{margin-right:auto}
.exp{margin-top:14px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:15px}
.exp p{margin:0}
.verd{font-weight:700;font-size:16px}.verd b{color:var(--ok)}
.xh{margin:14px 0 4px;font-size:13px;font-weight:800;color:var(--muted);text-transform:none}
.step{padding:8px 0;border-top:1px solid var(--line)}.step:first-of-type{border-top:0}
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:8px}
.chain .gap{flex-basis:100%;height:0}
.chain .lab{font-size:12px;font-weight:700;color:var(--muted);min-width:58px}
.chain .cop{color:var(--muted);font-weight:800;font-size:16px}
.vc{border:1.5px solid var(--line);border-radius:8px;padding:3px 9px;font-weight:700;background:var(--cell);min-width:32px;text-align:center;white-space:nowrap}
.vc.ans{border-color:var(--ok);color:var(--ok);box-shadow:0 0 0 1px var(--ok)}
.mini{margin:0;width:58px;text-align:center}
.mini svg{background:var(--cell);border:1.5px solid var(--line);border-radius:8px;padding:2px}
.mini.ans svg{border-color:var(--ok);box-shadow:0 0 0 2px var(--ok)}.mini.bad svg{border-color:var(--bad);box-shadow:0 0 0 2px var(--bad)}
.recapw{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-start;margin:10px 0 2px}
.recap{display:grid;gap:4px}.recap .mini{width:auto}.recap figcaption{white-space:nowrap}
.recap.mat{grid-template-columns:repeat(3,52px)}.recap.seq{grid-template-columns:repeat(6,44px)}.recap.ana{grid-template-columns:repeat(4,46px)}.recap.one{grid-template-columns:64px}
.recap.side{grid-auto-flow:column;grid-auto-columns:58px;gap:10px}
.mini figcaption{font-size:11px;line-height:1.2;color:var(--muted);margin-top:3px}
.wrong{margin-top:12px;background:var(--badBg);border-radius:12px;padding:10px 12px}.wrong .xh{margin-top:0;color:var(--bad)}.wrong p{margin:2px 0}
.trap{font-weight:600;margin-top:6px!important}
.method{margin-top:12px;background:var(--soft);border-radius:12px;padding:10px 12px}.method b{font-size:13px;color:var(--muted)}
.sheethead{display:flex;align-items:center;gap:10px;padding:0 0 10px;margin-bottom:6px;border-bottom:1px solid var(--line)}
.sheethead b{margin-right:auto;font-size:16px}
.xbtn{width:44px;height:44px;flex:none;border:1px solid var(--line);background:var(--paper);border-radius:12px;font-size:18px;cursor:pointer;color:var(--ink)}
.xbtn:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.scrim{display:none}
.fg .lg{stroke:var(--muted);stroke-width:2.4;stroke-dasharray:5 4;stroke-linecap:round}
.sync{font-size:13px;font-weight:600;color:var(--muted)}.sync.s-ok{color:var(--ok)}.sync.s-err{color:var(--bad)}
.cus{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.cus input{width:96px;min-height:42px;font:inherit;font-size:16px;font-weight:700;border:1.5px solid var(--ink);border-radius:10px;padding:6px 10px;background:var(--paper);color:var(--ink)}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px;margin-top:14px}
.pal button{min-height:44px;border:1.5px solid var(--line);background:var(--paper);border-radius:10px;font-weight:600;cursor:pointer}
.pal .done{background:var(--soft);border-color:var(--muted)}.pal .cur{border-color:var(--acc);color:var(--acc)}
/* resultado */
.res{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:20px}
.score b{font-size:clamp(48px,12vw,72px);line-height:1;font-weight:800;letter-spacing:-.03em;display:block}.score small{font-size:.45em;color:var(--muted)}.score span{font-weight:600}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px 16px;margin:0}
.kv dt{font-size:13px;color:var(--muted)}.kv dd{margin:0;font-weight:700;white-space:nowrap}
.kv.big{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:16px 18px}.kv.big dd{font-size:24px}
.bars{display:grid;gap:9px;margin:4px 0 12px}
.bar{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:14px}
.bt{height:10px;background:var(--soft);border-radius:6px;overflow:hidden}.bt i{display:block;height:100%;background:var(--ink);border-radius:6px}.bt i.b{background:var(--acc)}
.bv{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap;text-align:right;min-width:62px}
.rev{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:6px}
.rev li{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.rh{width:100%;border:0;background:var(--paper);display:flex;align-items:center;gap:10px;min-height:48px;padding:8px 12px;cursor:pointer;text-align:left}
.rh span{margin-right:auto;font-weight:600}
.st{font-style:normal;font-size:13px;font-weight:700;padding:2px 9px;border-radius:999px}.st.ok{color:var(--ok);background:var(--okBg)}.st.bad{color:var(--bad);background:var(--badBg)}
.rb{padding:4px 12px 14px;border-top:1px solid var(--line)}
.spark{display:flex;align-items:flex-end;gap:4px;height:110px;border-bottom:1px solid var(--line);padding-top:6px}
.spark button{flex:1;height:100%;border:0;background:none;padding:0;display:flex;align-items:flex-end;cursor:pointer;min-width:6px}
.spark i{display:block;width:100%;background:var(--ink);border-radius:4px 4px 0 0}
.hist{list-style:none;padding:0;margin:0}
.hist button{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;border:0;border-bottom:1px solid var(--line);background:none;padding:10px 2px;min-height:52px;cursor:pointer;text-align:left}
.hist small{display:block;color:var(--muted);font-size:13px}.num{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.empty{text-align:center;padding:28px 18px}
/* ajustes */
.radios{display:grid;gap:8px}
.rad,.tog{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer}
.rad input{margin-top:4px;accent-color:var(--acc);width:18px;height:18px;flex:none}
.rad b,.tog b{display:block}.rad small,.tog small{display:block;color:var(--muted);font-size:14px}
.tog{justify-content:space-between;align-items:center;margin-bottom:8px}
.tog input{appearance:none;width:48px;height:28px;border-radius:999px;background:var(--line);position:relative;flex:none;cursor:pointer;transition:background .15s}
.tog input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .15s}
.tog input:checked{background:var(--acc)}.tog input:checked::after{transform:translateX(20px)}
textarea{width:100%;font:13px/1.4 ui-monospace,monospace;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--soft);color:var(--ink);margin:12px 0 8px}
.file{position:relative;overflow:hidden}.file input{position:absolute;inset:0;opacity:0;cursor:pointer}
details summary{font-weight:800;cursor:pointer;min-height:32px}details p{color:var(--muted);font-size:15px}
/* diálogo e aviso */
#dlg{position:fixed;inset:0;z-index:20;background:rgba(10,12,16,.5);display:grid;place-items:center;padding:16px}
#dlg[hidden]{display:none}
.dbox{background:var(--paper);border-radius:18px;padding:20px;max-width:400px;width:100%}.dbox h3{margin:0 0 6px;font-size:19px}.dbox p{margin:0;color:var(--muted)}
#toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,40px);opacity:0;background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;transition:.2s;z-index:30;pointer-events:none;max-width:calc(100% - 32px)}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:600px){
  .hero{grid-template-columns:minmax(0,1fr)}.heroFig{justify-self:center;max-width:220px}
  .opts{grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}.opts:not(.n8) .opt{grid-column:span 2}.opts:not(.n8) .opt:nth-child(4){grid-column:2/span 2}
  .opts:not(.n8){width:min(100%,340px,46svh);margin:0 auto}.opts.n8{gap:7px}
  .opt{padding:17px 4px 4px;border-radius:10px}.opt b{top:2px;left:6px;font-size:12px}
  .prompt{font-size:17px;margin:2px 0 10px}.stim{margin-bottom:12px;gap:6px}
  .stim.ana{grid-template-columns:minmax(0,1fr) 10px minmax(0,1fr) 16px minmax(0,1fr) 10px minmax(0,1fr)}
  .opts{max-width:340px;margin:0 auto}.opts.n8{max-width:360px;gap:8px}.qtop .row{gap:6px}.tag{font-size:12px;padding:3px 8px}
  .stim.seq{gap:4px}.stim.seq .c{border-radius:6px;padding:2px}
  .res{grid-template-columns:minmax(0,1fr)}
  .bar{grid-template-columns:minmax(0,1fr) auto;row-gap:4px}.bt{grid-column:1/-1;grid-row:2}
  .brand span{display:none}.nav button{padding:10px 10px}
}
@media(max-width:700px){
  .exp.sheet{position:fixed;left:0;right:0;bottom:0;z-index:8;margin:0;max-height:72svh;overflow-y:auto;border-radius:20px 20px 0 0;border-bottom:0;padding:0 16px calc(16px + env(safe-area-inset-bottom));box-shadow:0 -12px 32px rgba(0,0,0,.28);overscroll-behavior:contain}
  .exp.sheet .sheethead{position:sticky;top:0;z-index:1;background:var(--paper);padding:14px 0 10px}
  .scrim{display:block;position:fixed;inset:0;z-index:7;background:rgba(8,10,14,.45);cursor:pointer}
  .exp.sheet .sheethead::before{content:"";position:absolute;top:5px;left:50%;width:36px;height:4px;margin-left:-18px;border-radius:4px;background:var(--line)}
  body.sheet main{padding-bottom:74svh}body.sheet .qbar{position:static}
}

/* ===== iOS: safe areas, barra de abas, toques e gestos ===== */
:root{--tabH:50px;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);--sw:light-dark(#34c759,#30d158)}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior-y:none}
input,textarea{-webkit-user-select:text;user-select:text}
.top{padding-top:var(--sat);background:color-mix(in srgb,var(--paper) 82%,transparent);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--line)}
.topin{min-height:44px;justify-content:center;padding-left:max(16px,var(--sal));padding-right:max(16px,var(--sar))}
.brand{margin:0;font-size:17px}
.brand span{display:inline}

<script>/* ===== Motor de geração de questões (determinístico por semente) ===== */
(function (root) {
'use strict';
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function RNG(seed){const f=mulberry32(seed>>>0);return{f,
  int:(a,b)=>a+Math.floor(f()*(b-a+1)),
  pick:a=>a[Math.floor(f()*a.length)],
  shuffle:a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(f()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;},
  chance:p=>f()<p};}

/* ---------- vocabulário ---------- */
const SH={circle:{sym:0},triangle:{sym:120,sides:3},square:{sym:90,sides:4},pentagon:{sym:72,sides:5},hexagon:{sym:60,sides:6},star:{sym:72},cross:{sym:90},arrow:{sym:360},half:{sym:360},flag:{sym:360}};
const SHAPE_PT={circle:'círculo',triangle:'triângulo',square:'quadrado',pentagon:'pentágono',hexagon:'hexágono',star:'estrela',cross:'cruz',arrow:'seta',half:'meia-lua',flag:'bandeira'};
const POLY=['triangle','square','pentagon','hexagon'];
const SYMM=['circle','triangle','square','pentagon','hexagon','star','cross'];
const ASYM=['arrow','half','flag'];
const FILL_PT=['vazio','cinza','cheio'];
const ATTR_PT={count:'Quantidade',shape:'Forma',size:'Tamanho',fill:'Preenchimento',rot:'Rotação',mark:'Ponto externo',lines:'Linhas'};
const RULE_PT={prog:'progressão',alt:'alternância',cyc3:'ciclo de 3',inter:'séries intercaladas',row:'constante na linha',col:'constante na coluna',dist3:'distribuição de três',add:'soma',sub:'subtração',or:'união (OU)',xor:'diferença (XOU)',and:'interseção (E)',const:'mudou o que era fixo'};
const SPECIAL={
  'esp:espelho':'Espacial · espelhada tomada por girada','esp:forma':'Espacial · forma alterada não percebida',
  'esp:eixo':'Espacial · eixo do espelho trocado','esp:rotespelho':'Espacial · giro tomado por reflexo',
  'int:lados':'Intrusa · pontos = número de lados','int:interna':'Intrusa · forma interna = externa','int:espelho':'Intrusa · figura espelhada',
  'ana:count':'Analogia · quantidade','ana:size':'Analogia · tamanho','ana:fill':'Analogia · preenchimento','ana:rot':'Analogia · rotação',
  'ana:shape':'Analogia · número de lados','ana:lines':'Analogia · linhas','ana:mark':'Analogia · ponto externo','tempo':'Tempo esgotado'};
function keyLabel(k){if(SPECIAL[k])return SPECIAL[k];const[a,r]=k.split(':');return (ATTR_PT[a]||a)+' · '+(RULE_PT[r]||r);}
const FAMS={seq:'Sequência',mat:'Matriz 3×3',ana:'Analogia',esp:'Rotação e espelho',int:'Figura intrusa'};

/* pools: [atributo, regra, nível mínimo] */
const SEQ_POOL=[['count','prog',1],['fill','cyc3',1],['shape','alt',1],['fill','alt',2],['count','alt',3],['rot','prog',3],['mark','prog',3],['shape','cyc3',4],['size','alt',5],['size','cyc3',5],['count','cyc3',6],['mark','alt',6],['count','inter',7],['rot','inter',7],['mark','inter',7]];
const MAT_POOL=[['count','row',1],['count','prog',1],['size','prog',1],['fill','row',1],['shape','row',1],['fill','prog',2],['shape','dist3',3],['count','dist3',3],['fill','dist3',3],['size','dist3',3],['shape','col',3],['count','col',4],['rot','prog',5],['rot','dist3',5],['count','add',5],['lines','or',5],['count','sub',7],['lines','xor',7],['lines','and',9]];
const ANA_POOL=[['count','ana',1],['fill','ana',1],['size','ana',1],['rot','ana',3],['shape','ana',5],['lines','ana',5],['mark','ana',7]];
const ESP_KEYS={'esp:espelho':1,'esp:forma':1,'esp:eixo':3,'esp:rotespelho':3};
const INT_KEYS={'int:lados':1,'int:interna':1,'int:espelho':7};
function poolKey(e){return e[1]==='ana'?'ana:'+e[0]:e[0]+':'+e[1];}
/* em que famílias / nível mínimo uma chave pode aparecer (para treino focado) */
function whereKey(k){const out=[];
  SEQ_POOL.forEach(e=>{if(poolKey(e)===k)out.push(['seq',e[2]]);});
  MAT_POOL.forEach(e=>{if(poolKey(e)===k)out.push(['mat',e[2]]);});
  ANA_POOL.forEach(e=>{if(poolKey(e)===k)out.push(['ana',e[2]]);});
  if(ESP_KEYS[k])out.push(['esp',ESP_KEYS[k]]);if(INT_KEYS[k])out.push(['int',INT_KEYS[k]]);
  if(!out.length&&k.endsWith(':const'))out.push(['seq',1],['mat',1],['ana',1]);
  return out;}

function pickRules(rng,pool,L,n,prefer){
  const cand=pool.filter(e=>e[2]<=L);const pf=new Set(prefer||[]);
  const order=rng.shuffle(cand.filter(e=>pf.has(poolKey(e)))).concat(rng.shuffle(cand.filter(e=>!pf.has(poolKey(e)))));
  const out=[],used=new Set();
  for(const e of order){if(out.length>=n)break;if(used.has(e[0]))continue;used.add(e[0]);out.push({attr:e[0],rule:e[1],key:poolKey(e)});}
  return out;}

/* ---------- painel ---------- */
function P(o){return Object.assign({shape:'circle',count:1,size:2,fill:0,rot:0,mark:-1,lines:0},o);}
function normRot(p){const s=SH[p.shape].sym;if(!s)return 0;return ((p.rot*45)%s+s)%s;}
function vkey(p){return [p.shape,p.count,p.size,p.fill,normRot(p),p.mark,p.lines].join('|');}
const ATTRS=['shape','count','size','fill','rot','mark','lines'];
function popc(m){let c=0;while(m){c+=m&1;m>>=1;}return c;}
function randMask(rng,maxBits){let m=0;const n=rng.int(1,maxBits||3);rng.shuffle([0,1,2,3,4,5]).slice(0,n).forEach(b=>m|=1<<b);return m;}
const plural=(n,s,p)=>n===1?s:p;
const dirTxt=k=>(k>0?'horário':'anti-horário');

/* ---------- opções balanceadas (estilo I-RAVEN) ---------- */
function subsetsBalanced(rng,k,nOpts){
  if(nOpts===8&&k===3)return [[],[0],[1],[2],[0,1],[0,2],[1,2],[0,1,2]];
  const all=[];for(let m=1;m<(1<<k);m++){const s=[];for(let i=0;i<k;i++)if(m&(1<<i))s.push(i);all.push(s);}
  const need=nOpts-1;const combos=[];
  (function rec(start,acc){if(acc.length===need){combos.push(acc.slice());return;}for(let i=start;i<all.length;i++){acc.push(all[i]);rec(i+1,acc);acc.pop();}})(0,[]);
  const good=combos.filter(c=>{for(let i=0;i<k;i++){const right=1+c.filter(s=>!s.includes(i)).length;if(right<2||right>3)return false;}return true;});
  return [[]].concat(rng.pick(good.length?good:combos));}
function buildOptions(rng,ans,flips,nOpts){
  const subs=subsetsBalanced(rng,flips.length,nOpts);
  for(let t=0;t<16;t++){
    const wrong=flips.map(f=>t===0?f.cands[0]:rng.pick(f.cands.slice(0,Math.min(f.cands.length,2+t))));
    const opts=subs.map(S=>{const p=Object.assign({},ans);S.forEach(i=>p[flips[i].attr]=wrong[i]);return{p,errs:S.map(i=>flips[i].key)};});
    if(new Set(opts.map(o=>vkey(o.p))).size===opts.length)return opts;}
  return null;}
function finalize(rng,item,opts,mkFig){
  const order=rng.shuffle(opts.map((_,i)=>i));
  item.options=order.map(i=>Object.assign({fig:mkFig(opts[i]),errs:opts[i].errs,why:opts[i].why||''},opts[i].tr?{tr:opts[i].tr}:{}));
  item.answer=order.indexOf(0);
  const ks=new Set(item.ruleKeys||[]);item.options.forEach(o=>o.errs.forEach(e=>ks.add(e)));item.keys=[...ks];
  return item;}
function uniq(a){return [...new Set(a)];}
function near(rng,dom,x){return typeof x==='number'&&dom.length&&typeof dom[0]==='number'?rng.shuffle(dom).sort((a,b)=>Math.abs(a-x)-Math.abs(b-x)):rng.shuffle(dom);}

/* ======================= SEQUÊNCIA ======================= */
function seqPredict(attr,v){
  const preds=new Set(),n=v.length;
  const cyc=attr==='fill'?3:(attr==='rot'||attr==='mark')?8:0;
  const isNum=attr==='count'||attr==='size'||cyc>0;
  const mod=x=>cyc?((x%cyc)+cyc)%cyc:x;const diff=(a,b)=>mod(b-a);
  const inDom=x=>attr==='count'?x>=1&&x<=9:attr==='size'?x>=0&&x<=2:true;
  if(v.every(x=>x===v[0]))preds.add(v[0]);
  if(v.every((x,i)=>i<2||x===v[i-2]))preds.add(v[n-2]);
  if(v.every((x,i)=>i<3||x===v[i-3]))preds.add(v[n-3]);
  if(isNum&&!(attr==='mark'&&v.includes(-1))){
    const d=diff(v[0],v[1]);if(v.every((x,i)=>i===0||diff(v[i-1],x)===d)){const x=mod(v[n-1]+d);if(inDom(x))preds.add(x);}
    const dE=diff(v[0],v[2]);if(diff(v[2],v[4])===dE){const x=mod(v[3]+diff(v[1],v[3]));if(inDom(x))preds.add(x);}
  }
  return preds;}
function genSeq(rng,L,prefer){
  const nVar=L<=2?1:L<=5?2:L<=8?3:4;
  const rules=pickRules(rng,SEQ_POOL,L,nVar,prefer);const R={};rules.forEach(r=>R[r.attr]=r.rule);
  const N=6;const S={};const ex=[];
  const pool=R.rot?ASYM:(rng.chance(.25)?ASYM:SYMM);
  const rep=(f)=>[...Array(N)].map((_,i)=>f(i));
  // forma
  if(R.shape==='alt'){const s=rng.shuffle(pool).slice(0,2);S.shape=rep(i=>s[i%2]);ex.push('Forma: alterna entre '+SHAPE_PT[s[0]]+' e '+SHAPE_PT[s[1]]+'.');}
  else if(R.shape==='cyc3'){const s=rng.shuffle(pool).slice(0,3);S.shape=rep(i=>s[i%3]);ex.push('Forma: repete o ciclo '+s.map(x=>SHAPE_PT[x]).join(' → ')+'.');}
  else{const s=rng.pick(pool);S.shape=rep(()=>s);}
  // quantidade
  if(R.count==='prog'){const d=rng.pick([1,1,-1]);const s=d>0?rng.int(1,4):rng.int(6,9);S.count=rep(i=>s+i*d);ex.push('Quantidade: '+(d>0?'aumenta':'diminui')+' 1 a cada figura.');}
  else if(R.count==='alt'){const s=rng.shuffle([1,2,3,4,5,6]).slice(0,2);S.count=rep(i=>s[i%2]);ex.push('Quantidade: alterna entre '+s[0]+' e '+s[1]+'.');}
  else if(R.count==='cyc3'){const s=rng.shuffle([1,2,3,4,5,6]).slice(0,3);S.count=rep(i=>s[i%3]);ex.push('Quantidade: repete o ciclo '+s.join(', ')+'.');}
  else if(R.count==='inter'){let ok=false,e,o,dE,dO;for(let t=0;t<30&&!ok;t++){e=rng.int(1,5);o=rng.int(1,5);dE=rng.pick([1,2,-1,0]);dO=rng.pick([1,2,-1,0]);
      if(dE===dO)continue;const vals=rep(i=>i%2?o+((i-1)/2)*dO:e+(i/2)*dE);if(vals.every(x=>x>=1&&x<=9)){S.count=vals;ok=true;}}
    if(!ok)return null;ex.push('Quantidade: duas séries intercaladas — nas posições ímpares '+(dE?(dE>0?'soma ':'subtrai ')+Math.abs(dE):'fica igual')+', nas pares '+(dO?(dO>0?'soma ':'subtrai ')+Math.abs(dO):'fica igual')+'.');}
  else{const c=rng.int(1,3);S.count=rep(()=>c);}
  // tamanho
  if(R.size==='alt'){const s=rng.shuffle([0,1,2]).slice(0,2);S.size=rep(i=>s[i%2]);ex.push('Tamanho: alterna entre dois tamanhos.');}
  else if(R.size==='cyc3'){const s=rng.shuffle([0,1,2]);S.size=rep(i=>s[i%3]);ex.push('Tamanho: repete um ciclo de três tamanhos.');}
  else{const s=rng.pick([1,2]);S.size=rep(()=>s);}
  // preenchimento
  if(R.fill==='cyc3'){const s=rng.int(0,2),d=rng.pick([1,2]);S.fill=rep(i=>(s+i*d)%3);ex.push('Preenchimento: ciclo '+[0,1,2].map(i=>FILL_PT[(s+i*d)%3]).join(' → ')+'.');}
  else if(R.fill==='alt'){const s=rng.shuffle([0,1,2]).slice(0,2);S.fill=rep(i=>s[i%2]);ex.push('Preenchimento: alterna entre '+FILL_PT[s[0]]+' e '+FILL_PT[s[1]]+'.');}
  else{const s=rng.int(0,2);S.fill=rep(()=>s);}
  // rotação / ponto externo
  const cycRule=(attr,rule,name,unit)=>{
    if(rule==='prog'){const k=rng.pick(L<5?[1,2]:[1,2,3])*rng.pick([1,-1]);const s=rng.int(0,7);S[attr]=rep(i=>((s+i*k)%8+8)%8);
      ex.push(attr==='rot'?'Rotação: gira '+Math.abs(k)*45+'° no sentido '+dirTxt(k)+' a cada figura.':'Ponto externo: anda '+Math.abs(k)+' '+plural(Math.abs(k),'casa','casas')+' no sentido '+dirTxt(k)+' a cada figura.');}
    else if(rule==='alt'){const s=rng.shuffle([0,1,2,3,4,5,6,7]).slice(0,2);S[attr]=rep(i=>s[i%2]);ex.push(name+': alterna entre duas posições.');}
    else if(rule==='inter'){let kE,kO;do{kE=rng.pick([0,1,2,3,-1,-2]);kO=rng.pick([0,1,2,3,-1,-2]);}while(kE===kO);
      const e=rng.int(0,7),o=rng.int(0,7);S[attr]=rep(i=>((i%2?o+((i-1)/2)*kO:e+(i/2)*kE)%8+8)%8);
      const t=k=>k?(Math.abs(k)*unit)+(attr==='rot'?'°':' '+plural(Math.abs(k),'casa','casas'))+' '+dirTxt(k):'fica parado';
      ex.push(name+': duas séries intercaladas — posições ímpares: '+t(kE)+'; pares: '+t(kO)+'.');}
  };
  if(R.rot)cycRule('rot',R.rot,'Rotação',45);else{const r=pool===ASYM?rng.int(0,7):0;S.rot=rep(()=>r);}
  if(R.mark)cycRule('mark',R.mark,'Ponto externo',1);else{const m=(L>=6&&rng.chance(.35))?rng.int(0,7):-1;S.mark=rep(()=>m);}
  S.lines=rep(()=>0);
  const panels=rep(i=>P({shape:S.shape[i],count:S.count[i],size:S.size[i],fill:S.fill[i],rot:S.rot[i],mark:S.mark[i],lines:S.lines[i]}));
  const known=panels.slice(0,5),ans=panels[5];
  for(const a of ATTRS){const pr=seqPredict(a,known.map(p=>p[a]));if(pr.size!==1||!pr.has(ans[a]))return null;}
  // alternativas
  const ruleAttrs=rng.shuffle(rules.map(r=>r.attr)).slice(0,3);
  const constAttrs=rng.shuffle(['fill','size','count','shape'].filter(a=>!R[a]));
  const flipAttrs=ruleAttrs.concat(constAttrs).slice(0,3);
  const flips=[];
  for(const a of flipAttrs){
    const ctx=known.map(p=>p[a]),x=ans[a],last=ctx[4],prev=ctx[3];const rule=R[a]||'const';
    let c=[];const cyc=a==='fill'?3:(a==='rot'||a==='mark')?8:0;const mod=v=>cyc?((v%cyc)+cyc)%cyc:v;
    if(rule==='prog'||rule==='inter')c=[last,mod(x+(x-last)),prev];else c=[last,prev,ctx[2]];
    const dom=a==='shape'?pool:a==='count'?[1,2,3,4,5,6,7,8,9]:a==='size'||a==='fill'?[0,1,2]:[0,1,2,3,4,5,6,7];
    c=uniq(c.concat(a==='rot'||a==='mark'?rng.shuffle(dom):near(rng,dom,x))).filter(v=>v!==x&&dom.includes(v)&&vkey(Object.assign({},ans,{[a]:v}))!==vkey(ans));
    if(!c.length)return null;
    flips.push({attr:a,key:a+':'+rule,cands:c});}
  const opts=buildOptions(rng,ans,flips,5);if(!opts)return null;
  const compact=panels.some(p=>p.mark>=0);

      ex.push(r.rule==='or'?'Linhas: a 3ª figura junta todas as linhas das duas primeiras.':r.rule==='xor'?'Linhas: a 3ª figura mostra só as linhas que aparecem em apenas uma das duas primeiras — as repetidas somem.':'Linhas: a 3ª figura mostra só as linhas que aparecem nas duas primeiras ao mesmo tempo.');}

  // constantes
  const cst={shape:rng.pick(pool),count:R.lines?1:rng.int(1,3),size:rng.pick([1,2]),fill:rng.int(0,2),rot:pool===ASYM?rng.int(0,7):0,mark:-1,lines:0};
  for(const a of ATTRS)if(!G[a])G[a]=grid(()=>cst[a]);

/* ======================= POLIMINÓS (espacial) ======================= */
function pNorm(cs){const mx=Math.min(...cs.map(c=>c.x)),my=Math.min(...cs.map(c=>c.y));return cs.map(c=>({x:c.x-mx,y:c.y-my,m:c.m?1:0})).sort((a,b)=>a.y-b.y||a.x-b.x);}

function pRotN(cs,n){for(let i=0;i<((n%4)+4)%4;i++)cs=pRot(cs);return pNorm(cs);}

function pMirV(cs){return pNorm(cs.map(c=>({x:c.x,y:-c.y,m:c.m})));}

function pConnected(cs){if(!cs.length)return false;const set=new Set(cs.map(c=>c.x+','+c.y));const seen=new Set([cs[0].x+','+cs[0].y]);const st=[cs[0]];
  while(st.length){const c=st.pop();for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const k=(c.x+dx)+','+(c.y+dy);if(set.has(k)&&!seen.has(k)){seen.add(k);st.push({x:c.x+dx,y:c.y+dy});}}}
  return seen.size===cs.length;}
function genPoly(rng,n,maxW,marks){
  for(let t=0;t<200;t++){const cs=[{x:0,y:0}];let g=0;
    while(cs.length<n&&g++<400){const b=rng.pick(cs),[dx,dy]=rng.pick([[1,0],[-1,0],[0,1],[0,-1]]);const x=b.x+dx,y=b.y+dy;
      if(cs.some(c=>c.x===x&&c.y===y))continue;const xs=cs.map(c=>c.x).concat(x),ys=cs.map(c=>c.y).concat(y);
      if(Math.max(...xs)-Math.min(...xs)>=maxW||Math.max(...ys)-Math.min(...ys)>=maxW)continue;cs.push({x,y});}
    if(cs.length<n)continue;
    rng.shuffle(cs.map((_,i)=>i)).slice(0,marks).forEach(i=>cs[i].m=1);
    const P0=pNorm(cs);if(new Set(pAll(P0).map(pKey)).size===8)return P0;}
  return null;}
function pAlter(rng,cs,forbidden){
  for(let t=0;t<60;t++){const marks=cs.filter(c=>c.m);
    if(marks.length&&rng.chance(.4)){const mi=cs.map((c,i)=>c.m?i:-1).filter(i=>i>=0),ui=cs.map((c,i)=>c.m?-1:i).filter(i=>i>=0);
      const a=rng.pick(mi),b=rng.pick(ui);const q=cs.map((c,j)=>({x:c.x,y:c.y,m:j===a?0:j===b?1:c.m}));
      if(!forbidden.has(pKey(q)))return{cs:pNorm(q),why:'A célula escura mudou de lugar.'};continue;}
    const i=rng.int(0,cs.length-1);const rest=cs.filter((_,j)=>j!==i);if(!pConnected(rest))continue;
    const b=rng.pick(rest),[dx,dy]=rng.pick([[1,0],[-1,0],[0,1],[0,-1]]);const x=b.x+dx,y=b.y+dy;
    if(cs.some(c=>c.x===x&&c.y===y))continue;const q=rest.concat([{x,y,m:cs[i].m}]);

  return null;}
function polyLevel(L){return{n:L<=2?4:L<=4?5:L<=6?6:L<=8?7:8,w:L<=8?4:5,marks:L<=4?0:L<=7?1:2};}
function genEsp(rng,L,prefer){

  const allSet=new Set(pAll(base).map(pKey));
  const pf=prefer||[];let mode=L>=3&&rng.chance(.5)?'esp':'rot';
  if(pf.includes('esp:eixo')||pf.includes('esp:rotespelho'))mode=L>=3?'esp':'rot';if(pf.includes('esp:espelho'))mode='rot';
  const nAlt=L<=2?2:L<=6?1:0;const opts=[];const ex=[];let prompt;let k=0;
  if(mode==='rot'){k=rng.int(1,3);opts.push({cs:pRotN(base,k),errs:[]});
    const mj=rng.shuffle([0,1,2,3]);for(let i=0;i<4-nAlt;i++)opts.push({cs:pRotN(pMirH(base),mj[i]),errs:['esp:espelho'],why:'É a figura espelhada (virada). Só girando não se chega nela.',tr:{m:'h',r:mj[i]}});

    const rj=rng.shuffle([1,2,3]);opts.push({cs:pRotN(base,rj[0]),errs:['esp:rotespelho'],why:'É o modelo apenas girado, não refletido.',tr:{m:'none',r:rj[0]}});
    if(nAlt<2){const r=rng.pick([1,3]);opts.push({cs:pRotN(pMirH(base),r),errs:['esp:eixo'],why:'Foi refletida e também girada.',tr:{m:'h',r}});}
    if(nAlt<1)opts.push({cs:pRotN(base,rj[1]),errs:['esp:rotespelho'],why:'É o modelo apenas girado, não refletido.',tr:{m:'none',r:rj[1]}});
    prompt='Qual alternativa é o modelo refletido num espelho colocado ao seu lado (esquerda ↔ direita)?';
    ex.push('A correta é o reflexo lateral: o que está à esquerda passa para a direita, e cima/baixo continuam iguais.');}
  while(opts.length<5){const src=mode==='rot'?pRotN(base,rng.int(0,3)):pRotN(pMirH(base),rng.pick([0,2]));const a=pAlter(rng,src,allSet);if(!a)return null;opts.push({cs:a.cs,errs:['esp:forma'],why:a.why,tr:{alt:1}});}
  if(new Set(opts.map(o=>pKey(o.cs))).size!==5)return null;
  const target=mode==='rot'?new Set([0,1,2,3].map(r=>pKey(pRotN(base,r)))):new Set([pKey(pMirH(base))]);
  if(opts.filter(o=>target.has(pKey(o.cs))).length!==1||!target.has(pKey(opts[0].cs)))return null;
  const item={fam:'esp',prompt,stim:{type:'model',figs:[{k:'poly',cs:base}]},explain:ex,ruleKeys:[]};
  const it=finalize(rng,item,opts,o=>({k:'poly',cs:o.cs}));it._ctx={base,mode,k};return it;}

/* ======================= INTRUSA ======================= */
function genInt(rng,L,prefer){
  const avail=['lados','interna'].concat(L>=7?['espelho']:[]);
  let rule=(prefer||[]).map(k=>k.replace('int:','')).find(r=>avail.includes(r));
  if(!rule)rule=L>=7&&rng.chance(.6)?'espelho':rng.pick(['lados','interna']);
  const noise=L>=4;const j=rng.int(0,4);const figs=[];const ex=[];let why;
  if(rule==='lados'){let sh;do{sh=[0,1,2,3,4].map(()=>rng.pick(POLY));}while(new Set(sh).size<3);
    for(let i=0;i<5;i++){const s=SH[sh[i]].sides;let k=s;if(i===j){k=s+rng.pick([1,-1]);}
      figs.push({k:'int',t:'lados',shape:sh[i],n:k,fill:noise?rng.int(0,1):0,rot:L>=7?rng.int(0,7):0});}
    ex.push('Nas demais, o número de pontos é igual ao número de lados da figura.','Na intrusa, a contagem não bate: '+figs[j].n+' pontos em um '+SHAPE_PT[figs[j].shape]+'.');
    why='Esta segue a regra: pontos = lados.';}
  else if(rule==='interna'){const pool=['circle','triangle','square','pentagon','hexagon'];let sh;do{sh=[0,1,2,3,4].map(()=>rng.pick(pool));}while(new Set(sh).size<3);
    for(let i=0;i<5;i++){let inn=sh[i];if(i===j)inn=rng.pick(pool.filter(s=>s!==sh[i]));figs.push({k:'int',t:'interna',shape:sh[i],inner:inn,fill:noise?rng.int(1,2):2});}
    ex.push('Nas demais, a figura de dentro tem a mesma forma da figura de fora.','Na intrusa, a forma de dentro é diferente.');
    why='Esta segue a regra: dentro e fora têm a mesma forma.';}
  else{const pv=polyLevel(L);const base=genPoly(rng,Math.max(5,pv.n-1),pv.w,L>=9?1:0);if(!base)return null;
    const rs=rng.shuffle([0,1,2,3]);let q=0;var ebase=base;for(let i=0;i<5;i++)figs.push({k:'poly',cs:i===j?pRotN(pMirH(base),rng.int(0,3)):pRotN(base,rs[q++])});
    ex.push('As demais são a mesma peça em posições diferentes (só giradas).','A intrusa é a peça espelhada: nenhum giro transforma as outras nela.');
    why='Esta é a mesma peça das outras, apenas girada.';}
  // checagem de "intrusa superficial" (alguma característica visível isolaria outra figura)
  if(rule!=='espelho'){const feats=rule==='lados'?['shape','fill','n',f=>normRot({shape:f.shape,rot:f.rot})]:['shape','inner','fill'];
    for(const ft of feats){const vals=figs.map(f=>typeof ft==='function'?ft(f):f[ft]);
      for(let i=0;i<5;i++){const others=vals.filter((_,q)=>q!==i);if(others.every(v=>v===others[0])&&vals[i]!==others[0])return null;}}}
  if(new Set(figs.map(f=>f.k==='poly'?pKey(f.cs):JSON.stringify(f))).size<5)return null;
  const opts=[figs[j]].concat(figs.filter((_,i)=>i!==j)).map((f,i)=>({f,errs:i?['int:'+rule]:[],why:i?why:''}));
  const item={fam:'int',prompt:'Qual figura NÃO segue a mesma regra das outras?',stim:{type:'none',figs:[]},explain:ex,ruleKeys:['int:'+rule]};
  // a ordem original das figuras é mantida (a intrusa fica na posição j)
  item.options=figs.map((f,i)=>({fig:f,errs:i===j?[]:['int:'+rule],why:i===j?'':why}));item.answer=j;item.keys=['int:'+rule];
  item._ctx={rule,figs,j,base:typeof ebase!=='undefined'?ebase:null};return item;}

/* ======================= EXPLICAÇÕES (método de observação) ======================= */
const SIZE_PT=['pequeno','médio','grande'];const DIR=['↑','↗','→','↘','↓','↙','←','↖'];const LINE_PT=['│','─','╲','╱','▔','▁'];
const ANAME={count:'quantidade',shape:'forma',size:'tamanho',fill:'preenchimento',rot:'direção',mark:'ponto de fora',lines:'traços'};
const cap1=s=>s[0].toUpperCase()+s.slice(1);
function chip(a,v){switch(a){case'count':return String(v);case'shape':return SHAPE_PT[v];case'size':return SIZE_PT[v];case'fill':return FILL_PT[v];
  case'rot':return DIR[v];case'mark':return v<0?'—':DIR[v];case'lines':return v?[0,1,2,3,4,5].filter(b=>v&(1<<b)).map(b=>LINE_PT[b]).join(' '):'nenhum';}return String(v);}
function chain(vals,a,ansIdx){const out=[];vals.forEach((v,i)=>{if(i)out.push({o:'›'});out.push({v:chip(a,v),ans:i===ansIdx});});return out;}
function turn(k){k=((k%8)+8)%8;const cw=k<=4;const n=cw?k:8-k;return{deg:n*45,dir:cw?'no sentido horário ↻':'no sentido anti-horário ↺',n};}
const TRAP={prog:'Armadilha comum: parar no último valor ou pular um passo a mais.',alt:'Armadilha comum: continuar subindo quando o padrão só vai e volta.',
  cyc3:'Armadilha comum: repetir o último valor em vez de voltar ao início do ciclo.',inter:'Armadilha comum: comparar figuras vizinhas — aqui a série pula uma figura.',
  row:'Armadilha comum: copiar o valor de outra linha.',col:'Armadilha comum: olhar a linha quando a regra está na coluna.',
  dist3:'Armadilha comum: repetir um valor que já apareceu na mesma linha.',add:'Armadilha comum: subtrair em vez de somar, ou copiar a 2ª figura.',
  sub:'Armadilha comum: somar em vez de subtrair.',or:'Armadilha comum: apagar os traços repetidos — nesta regra eles ficam.',
  xor:'Armadilha clássica: juntar tudo. Nesta regra, traço que aparece nas duas some.',and:'Armadilha comum: juntar tudo — aqui só fica o que é comum às duas.',
  const:'Essa característica é igual em todas as figuras; a alternativa mudou o que era fixo.',ana:'Aplique em C exatamente a mudança de A→B: nem mais, nem menos.'};
function panelDiag(it,ansP,ruleOf){it.options.forEach((o,i)=>{if(i===it.answer||o.fig.k!=='panel')return;const p=o.fig.p;const ds=[];
  for(const a of ATTRS){if(a==='rot'){if(p.shape===ansP.shape&&normRot(p)!==normRot(ansP))ds.push(a);}else if(p[a]!==ansP[a])ds.push(a);}
  o.diag={lines:ds.map(a=>cap1(ANAME[a])+': '+chip(a,p[a])+' — deveria ser '+chip(a,ansP[a])+'.'),traps:uniq(ds.map(a=>TRAP[ruleOf[a]||'const']))};});}
const lf=(m,gh)=>({fig:{k:'panel',p:P({count:0,lines:m,ghost:gh||0})}});
function annSeq(it,c){const R=c.R,V=c.vals;
  it.method='Compare as figuras uma característica de cada vez — quantidade, forma, preenchimento, tamanho, direção, ponto de fora — e pergunte: sobe? alterna? repete de 3 em 3?';
  const steps=[];
  for(const a of ATTRS){const r=R[a];if(!r)continue;const v=V[a];let t,ch=chain(v,a,5);
    if(r==='prog'){if(a==='count'){const d=v[1]-v[0];t='Conte as figuras de cada quadro: '+(d>0?'+':'−')+Math.abs(d)+' de um para o próximo.';}
      else{const tr=turn(v[1]-v[0]);t=a==='rot'?'Siga para onde a figura aponta: gira '+tr.deg+'° '+tr.dir+' a cada quadro.':'Siga o ponto de fora: anda '+tr.n+' '+plural(tr.n,'casa','casas')+' '+tr.dir+' a cada quadro.';}}
    else if(r==='alt')t='Vai e volta entre '+chip(a,v[0])+' e '+chip(a,v[1])+': a resposta repete o 4º quadro.';
    else if(r==='cyc3')t='Repete de 3 em 3 ('+[0,1,2].map(i=>chip(a,v[i])).join(' → ')+'): a resposta é igual ao 3º quadro.';
    else if(r==='inter'){t='Olhe pulando um quadro: 1º-3º-5º formam uma série; 2º-4º-resposta formam outra.';ch=[{lab:'1º · 3º · 5º'}].concat(chain([v[0],v[2],v[4]],a,-1),[{gap:1},{lab:'2º · 4º · ?'}],chain([v[1],v[3],v[5]],a,2));}
    steps.push({h:ATTR_PT[a],t,ch});}
  const fixed=['shape','count','size','fill'].filter(a=>!R[a]).map(a=>ANAME[a]+' ('+chip(a,V[a][0])+')');
  if(fixed.length)steps.push({h:'Não muda',t:cap1(fixed.join(', '))+' — a resposta mantém.'});
  it.steps=steps;panelDiag(it,c.ans,R);}
function annMat(it,c){const G=c.G,R=c.R;
  it.method='Leia a 1ª linha da esquerda para a direita, uma característica por vez. Confirme a mesma regra na 2ª linha. Só então aplique na 3ª.';
  const steps=[];
  for(const a of ATTRS){const r=R[a];if(!r)continue;const g=G[a];const row=(i,ai)=>chain(g[i],a,ai);let t,ch;
    if(r==='row'){t='Cada linha tem um único valor. A 3ª linha começa com '+chip(a,g[2][0])+', então termina com ele.';ch=[{lab:'Linha 1'}].concat(row(0,-1),[{gap:1},{lab:'Linha 3'}],row(2,2));}
    else if(r==='col'){t='Olhe de cima para baixo: cada coluna tem um único valor. A 3ª coluna é '+chip(a,g[0][2])+'.';ch=[{lab:'Coluna 3'}].concat(chain([g[0][2],g[1][2],g[2][2]],a,2));}
    else if(r==='prog'){let vb;if(a==='rot'){const tr=turn(g[0][1]-g[0][0]);vb='gira '+tr.deg+'° '+tr.dir;}else{const d=g[0][1]-g[0][0];vb=a==='count'?(d>0?'+':'−')+Math.abs(d)+' a cada passo':(d>0?'aumenta':'diminui')+' um passo de cada vez';}
      t='Na 1ª linha, da esquerda para a direita: '+vb+'. Faça o mesmo na 3ª.';ch=[{lab:'Linha 1'}].concat(row(0,-1),[{gap:1},{lab:'Linha 3'}],row(2,2));}
    else if(r==='dist3'){const S=[...new Set(g[0])];t='Cada linha tem os mesmos três ('+S.map(x=>chip(a,x)).join(', ')+'), um de cada. Na 3ª já apareceram '+chip(a,g[2][0])+' e '+chip(a,g[2][1])+': falta o que não apareceu.';ch=[{lab:'Linha 3'}].concat(row(2,2));}
    else if(r==='add'||r==='sub'){const op=r==='add'?'+':'−';t='Conte as figuras: em cada linha, 1ª '+op+' 2ª = 3ª.';const eq=(i,ans)=>[{v:String(g[i][0])},{o:op},{v:String(g[i][1])},{o:'='},{v:String(g[i][2]),ans}];ch=[{lab:'Linha 1'}].concat(eq(0,false),[{gap:1},{lab:'Linha 3'}],eq(2,true));}
    else{t=r==='or'?'Sobreponha as duas primeiras: todo traço que aparece em qualquer uma delas fica na 3ª.':r==='xor'?'Sobreponha as duas primeiras: traço que aparece nas DUAS some (tracejado); traço que aparece em só uma FICA.':'Sobreponha as duas primeiras: fica só o traço que aparece nas DUAS (os outros somem, tracejados).';
      const gh=i=>r==='xor'?(g[i][0]&g[i][1]):r==='and'?((g[i][0]|g[i][1])&~g[i][2]):0;
      const eq=(i,ans)=>[lf(g[i][0]),{o:'+'},lf(g[i][1]),{o:'='},Object.assign(lf(g[i][2],gh(i)),{ans})];ch=[{lab:'Linha 1'}].concat(eq(0,false),[{gap:1},{lab:'Linha 3'}],eq(2,true));}
    steps.push({h:a==='lines'?'Traços':ATTR_PT[a],t,ch});}
  const fixed=['shape','count','size','fill'].filter(a=>!R[a]&&!(a==='count'&&R.lines)).map(a=>ANAME[a]+' ('+chip(a,G[a][0][0])+')');
  if(fixed.length)steps.push({h:'Não muda',t:cap1(fixed.join(', '))+' — igual em todas as células.'});
  it.steps=steps;panelDiag(it,c.ans,R);}
function annAna(it,c){const{A,B,C,D,O,T}=c;
  it.method='Descubra o que muda de A para B, uma característica por vez, e faça exatamente a mesma mudança em C. O que não mudou de A para B fica igual a C.';
  const steps=[];
  for(const a of ATTRS){if(!O[a])continue;let t,ch;
    if(a==='lines'){t=T.lmode==='add'?'De A para B aparecem traços novos: acrescente os mesmos em C.':'Os traços marcados trocam: onde havia, some; onde não havia, aparece. Faça o mesmo em C.';
      ch=[{lab:'A › B'},lf(A.lines),{o:'›'},lf(B.lines),{gap:1},{lab:'C › ?'},lf(C.lines),{o:'›'},Object.assign(lf(D.lines),{ans:true})];}
    else{let vb;if(a==='rot'){const tr=turn(B.rot-A.rot);vb='gira '+tr.deg+'° '+tr.dir;}else if(a==='mark'){const tr=turn(B.mark-A.mark);vb='o ponto anda '+tr.n+' '+plural(tr.n,'casa','casas')+' '+tr.dir;}
      else if(a==='count'){const d=B.count-A.count;vb=(d>0?'+':'−')+Math.abs(d)+' '+plural(Math.abs(d),'figura','figuras');}
      else if(a==='shape')vb=(POLY.indexOf(B.shape)>POLY.indexOf(A.shape)?'ganha':'perde')+' um lado';
      else if(a==='size')vb=B.size>A.size?'cresce um tamanho':'diminui um tamanho';else vb=FILL_PT[A.fill]+' vira '+FILL_PT[B.fill];
      t='De A para B: '+vb+'. Em C, faça igual.';ch=[{lab:'A › B'},{v:chip(a,A[a])},{o:'›'},{v:chip(a,B[a])},{gap:1},{lab:'C › ?'},{v:chip(a,C[a])},{o:'›'},{v:chip(a,D[a]),ans:true}];}
    steps.push({h:a==='lines'?'Traços':ATTR_PT[a],t,ch});}
  const fixed=['shape','count','size','fill'].filter(a=>!O[a]).map(a=>ANAME[a]+' ('+chip(a,C[a])+')');
  if(fixed.length)steps.push({h:'Copie de C',t:cap1(fixed.join(', '))+' — não mudou de A para B, então fica como está em C.'});
  const R={};for(const a of ATTRS)if(O[a])R[a]='ana';it.steps=steps;panelDiag(it,D,R);}
function annEsp(it,c){const b=c.base,L=it.letters;const pf=cs=>({k:'poly',cs});
  if(c.mode==='rot'){it.method='Escolha um detalhe fácil de seguir — a ponta mais comprida ou a célula escura — e acompanhe para onde ele vai a cada giro. No fim, confira se ele caiu do mesmo lado.';
    const ch=[];for(let r=0;r<=c.k;r++){if(r)ch.push({o:'↻'});ch.push({fig:pf(pRotN(b,r)),cap:r?r*90+'°':'modelo',ans:r===c.k});}
    it.steps=[{h:'Gire o modelo',t:'Girando de 90° em 90° no sentido horário chega-se à alternativa '+L[it.answer]+'.',ch},
      {h:'Teste do espelho',t:'Na figura espelhada o detalhe fica do lado oposto, e nenhum giro resolve isso. Por isso as espelhadas estão erradas.',ch:[{fig:pf(b),cap:'modelo'},{o:'|'},{fig:pf(pMirH(b)),cap:'espelhada'}]}];}
  else{it.method='Imagine um espelho em pé ao lado do modelo: o que está à esquerda vai para a direita, e o que está em cima continua em cima. Não há giro.';
    it.steps=[{h:'Reflita',t:'Cada quadrado troca de lado (esquerda ↔ direita) e mantém a altura.',ch:[{fig:pf(b),cap:'modelo'},{o:'|'},{fig:pf(pMirH(b)),cap:'reflexo',ans:true}]}];}
  it.options.forEach((o,i)=>{if(i===it.answer||!o.tr)return;const t=o.tr;let vis=null,line=o.why;
    if(t.m==='h'){vis=[{fig:pf(b),cap:'modelo'},{o:'|'},{fig:pf(pMirH(b)),cap:'espelhado'}].concat(t.r?[{o:'↻'},{fig:o.fig,cap:L[i]}]:[]);
      line=c.mode==='rot'?L[i]+' é o modelo espelhado'+(t.r?' e depois girado':'')+': o detalhe ficou do lado oposto.':L[i]+' foi refletida e também girada '+t.r*90+'°.';}
    else if(t.m==='v'){vis=[{fig:pf(b),cap:'modelo'},{o:'—'},{fig:o.fig,cap:L[i]}];line=L[i]+' foi refletida de cima para baixo: o espelho ficou deitado, não em pé.';}
    else if(t.m==='none'){vis=[{fig:pf(b),cap:'modelo'},{o:'↻'},{fig:o.fig,cap:L[i]+' · '+t.r*90+'°'}];line=L[i]+' é só o modelo girado '+t.r*90+'°: nada foi refletido.';}
    o.diag={lines:[line],traps:[],vis};});}
function annInt(it,c){const L=it.letters,f=c.figs,j=c.j;

  if(c.rule==='espelho'&&c.base){const ref=f.find((x,i)=>i!==j).cs;const back=x=>{for(let r=0;r<4;r++){const y=pRotN(x,r);if(pKey(y)===pKey(ref))return y;}return null;};

    c.rule==='interna'?L[i]+' tem '+SHAPE_PT[f[i].shape]+' fora e '+SHAPE_PT[f[i].inner]+' dentro: segue a regra.':L[i]+' é a mesma peça das outras, só girada.'],traps:[]};});}
const ANN={seq:annSeq,mat:annMat,ana:annAna,esp:annEsp,int:annInt};

/* ======================= fábrica ======================= */
const GENS={seq:genSeq,mat:genMat,ana:genAna,esp:genEsp,int:genInt};
function make(fam,lvl,seed,prefer){
  for(let L=lvl;L>=1;L--){const rng=RNG((seed^(L*2654435761))>>>0);
    for(let t=0;t<400;t++){const it=GENS[fam](rng,L,prefer);if(it){it.lvl=lvl;it.realLvl=L;it.seed=seed;it.letters='ABCDEFGH'.slice(0,it.options.length).split('');ANN[fam](it,it._ctx);delete it._ctx;return it;}}}
  throw new Error('falha ao gerar '+fam);}

const LAY={1:[[50,50]],2:[[30,50],[70,50]],3:[[50,30],[30,68],[70,68]],4:[[32,32],[68,32],[32,68],[68,68]],5:[[30,30],[70,30],[50,50],[30,70],[70,70]],
  6:[[30,25],[70,25],[30,50],[70,50],[30,75],[70,75]],7:[[25,25],[50,25],[75,25],[50,50],[25,75],[50,75],[75,75]],
  8:[[25,25],[50,25],[75,25],[37,50],[63,50],[25,75],[50,75],[75,75]],9:[[25,25],[50,25],[75,25],[25,50],[50,50],[75,50],[25,75],[50,75],[75,75]]};
const BASE_R={1:30,2:17,3:16,4:15,5:12,6:11,7:10,8:10,9:10};
const SIZE_F=[0.55,0.78,1];
function shapePts(type){
  if(SH[type].sides){const n=SH[type].sides;const off=n%2?0:180/n;return[...Array(n)].map((_,i)=>{const a=(-90+off+i*360/n)*Math.PI/180;return[Math.cos(a),Math.sin(a)];});}
  if(type==='star')return[...Array(10)].map((_,i)=>{const a=(-90+i*36)*Math.PI/180,r=i%2?0.45:1;return[r*Math.cos(a),r*Math.sin(a)];});
  if(type==='cross'){const t=0.34;return[[-t,-1],[t,-1],[t,-t],[1,-t],[1,t],[t,t],[t,1],[-t,1],[-t,t],[-1,t],[-1,-t],[-t,-t]];}
  if(type==='arrow')return[[0,-1],[0.75,-0.1],[0.3,-0.1],[0.3,1],[-0.3,1],[-0.3,-0.1],[-0.75,-0.1]];
  if(type==='half')return[...Array(17)].map((_,i)=>{const a=Math.PI+Math.PI*i/16;return[Math.cos(a),Math.sin(a)*1.0+0.45];});
  if(type==='flag')return[[-0.65,1],[-0.65,-1],[0.85,-0.55],[-0.38,-0.1],[-0.38,1]];
  return null;}
function shapeSVG(type,cx,cy,r,rotDeg,cls){
  if(type==='circle')return'<circle cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'" r="'+(r*0.92).toFixed(1)+'" class="'+cls+'"/>';
  const a=rotDeg*Math.PI/180,ca=Math.cos(a),sa=Math.sin(a);
  const pts=shapePts(type).map(([x,y])=>[(cx+r*(x*ca-y*sa)).toFixed(1),(cy+r*(x*sa+y*ca)).toFixed(1)].join(',')).join(' ');
  return'<polygon points="'+pts+'" class="'+cls+'"/>';}
const LINE_SEG=[[50,8,50,92],[8,50,92,50],[14,14,86,86],[86,14,14,86],[14,14,86,14],[14,86,86,86]];
function panelSVG(p,compact){let s='';
  for(let b=0;b<6;b++)if(p.lines&(1<<b)){const l=LINE_SEG[b];s+='<line x1="'+l[0]+'" y1="'+l[1]+'" x2="'+l[2]+'" y2="'+l[3]+'" class="ln"/>';}
  if(p.ghost)for(let b=0;b<6;b++)if(p.ghost&(1<<b)){const l=LINE_SEG[b];s+='<line x1="'+l[0]+'" y1="'+l[1]+'" x2="'+l[2]+'" y2="'+l[3]+'" class="lg"/>';}
  if(!p.count)return s;
  const k=(compact?0.78:1)*(p.lines?0.6:1);const lay=LAY[p.count]||LAY[1];
  const r=BASE_R[p.count]*SIZE_F[p.size]*k;
  for(const[x,y]of lay){const cx=50+(x-50)*(compact?0.8:1),cy=50+(y-50)*(compact?0.8:1);s+=shapeSVG(p.shape,cx,cy,r,p.rot*45,'sh f'+p.fill);}
  if(p.mark>=0){const a=(-90+p.mark*45)*Math.PI/180;s+='<circle cx="'+(50+43*Math.cos(a)).toFixed(1)+'" cy="'+(50+43*Math.sin(a)).toFixed(1)+'" r="5" class="mk"/>';}
  return s;}
function polySVG(cs){const n=pNorm(cs);const w=Math.max(...n.map(c=>c.x))+1,h=Math.max(...n.map(c=>c.y))+1;const u=Math.min(80/w,80/h,20);
  const ox=50-w*u/2,oy=50-h*u/2;return n.map(c=>'<rect x="'+(ox+c.x*u).toFixed(1)+'" y="'+(oy+c.y*u).toFixed(1)+'" width="'+u.toFixed(1)+'" height="'+u.toFixed(1)+'" class="sh '+(c.m?'f2':'f0')+'"/>').join('');}
function intSVG(f){
  if(f.t==='lados'){let s=shapeSVG(f.shape,50,f.shape==='triangle'?56:50,f.shape==='triangle'?42:38,f.rot*45,'sh f'+f.fill);
    const lay=LAY[f.n]||LAY[1];const cy=f.shape==='triangle'?60:50;for(const[x,y]of lay)s+='<circle cx="'+(50+(x-50)*0.4).toFixed(1)+'" cy="'+(cy+(y-50)*0.4).toFixed(1)+'" r="3.6" class="mk"/>';return s;}
  return shapeSVG(f.shape,50,50,40,0,'sh f0')+shapeSVG(f.inner,50,f.shape==='triangle'?57:50,15,0,'sh f'+f.fill);}
function figSVG(f){const inner=f.k==='panel'?panelSVG(f.p,f.compact):f.k==='poly'?polySVG(f.cs):intSVG(f);
  return'<svg viewBox="0 0 100 100" class="fg" aria-hidden="true">'+inner+'</svg>';}

const API={make,figSVG,keyLabel,FAMS,whereKey,RNG,_seqPredict:seqPredict,_matPredict:matPredict,_vkey:vkey,_pKey:pKey,_pAll:pAll};
if(typeof module!=='undefined'&&module.exports)module.exports=API;else root.PV=API;
})(this);

<script>{
const $=s=>document.querySelector(s);
const app=$('#app');
const KEY='psicovisual.v1';
const DEF={feedback:'eye',showCorrect:false,timer:true,qTime:0,showLevel:true};
const NATIVE=(window.webkit&&window.webkit.messageHandlers&&window.webkit.messageHandlers.pf)||null;
function native(type,data){if(!NATIVE)return;try{NATIVE.postMessage({type:type,data:data===undefined?null:data});}catch(e){}}
function haptic(k){native('haptic',k);}
let DB=null;try{DB=JSON.parse(localStorage.getItem(KEY));}catch(e){}
if(window.__PF_DB){try{const n=JSON.parse(window.__PF_DB);if(n&&n.v===1&&(!DB||DB.v!==1||(n.saved||0)>=(DB.saved||0)))DB=n;}catch(e){}}
if(!DB||DB.v!==1)DB={v:1,settings:{},sessions:[],current:null,est:{}};
DB.settings=Object.assign({},DEF,DB.settings);
let storeOK=true,REM=null,UID=null,SYNC='wait';
const BASE=()=>'data/users/'+UID;
const WQ={};
function rwrite(path,data,del){if(!REM)return;const q=WQ[path]||(WQ[path]={busy:false,next:null});q.next={data,del};if(q.busy)return;
  (async()=>{q.busy=true;while(q.next){const w=q.next;q.next=null;
    for(let t=0;t<2;t++){try{const ref=REM.doc(path);if(w.del)await ref.delete();else await ref.set(w.data);setSync('ok');break;}
      catch(e){if(e&&e.code==='unavailable'&&t===0){await new Promise(r=>setTimeout(r,600+Math.random()*900));continue;}
        setSync('err');if(e&&e.code==='quota_exceeded')toast('Espaço da conta cheio: apague sessões antigas em Ajustes.');break;}}}
    q.busy=false;})();}
function save(){DB.saved=Date.now();const txt=JSON.stringify(DB);try{localStorage.setItem(KEY,txt);storeOK=true;}catch(e){storeOK=false;}native('save',txt);
  if(REM)rwrite(BASE()+'/state',{v:1,settings:DB.settings,est:DB.est,current:DB.current||null});}
function saveSession(s){if(REM)rwrite(BASE()+'/s-'+s.id,{v:1,session:s});}
function dropSession(id){if(REM)rwrite(BASE()+'/s-'+id,null,true);}
function setSync(st){if(SYNC===st)return;SYNC=st;const el=document.getElementById('sync');if(el)el.outerHTML=syncHTML();}
function syncHTML(){const t=SYNC==='device'?'Salvo neste aparelho':SYNC==='ok'?'Salvo na sua conta':SYNC==='wait'?'Conectando à sua conta…':SYNC==='err'?'Falha ao salvar na conta; guardado neste aparelho':'Salvo só neste navegador';
  return '<span id="sync" class="sync s-'+SYNC+'">'+t+'</span>';}
async function initRemote(){
  if(NATIVE){setSync('device');return;}
  try{if(typeof claude==='undefined'||!claude.use){setSync('local');return;}
    const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(!db||!user){setSync('local');return;}const id=await user.id();if(!id){setSync('local');return;}
    const tm=setTimeout(()=>{if(SYNC==='wait')setSync('local');},10000);
    REM=db;UID=id;const snap=await db.collection(BASE()).get();clearTimeout(tm);
    let rstate=null;const rs={};
    for(const d of snap.docs){const b=d.data()||{};if(d.id==='state')rstate=b;else if(d.id.startsWith('s-')&&b.session)rs[b.session.id]=b.session;}
    const ls={};DB.sessions.forEach(x=>ls[x.id]=x);
    const up=DB.sessions.filter(x=>!rs[x.id]);
    const all=Object.assign({},rs,ls);DB.sessions=Object.values(all).sort((a,b)=>a.created-b.created).slice(-300);
    if(rstate){DB.settings=Object.assign({},DEF,rstate.settings||{},DB._localSettingsTouched?DB.settings:{});
      DB.est=Object.assign({},rstate.est||{},DB.est);
      if(!DB.current&&rstate.current&&!all[rstate.current.id])DB.current=rstate.current;}
    setSync('ok');save();up.forEach(saveSession);
    if(view!=='quiz')render();
  }catch(e){REM=null;setSync('local');}}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const FAMS=PV.FAMS,FK=Object.keys(FAMS);const SHORT={seq:'Sequência',mat:'Matriz',ana:'Analogia',esp:'Rotação',int:'Intrusa'};
const pct=(a,b)=>b?Math.round(100*a/b):0;
const fmtT=ms=>{const s=Math.round(ms/1000);return s<60?s+' s':Math.floor(s/60)+' min '+String(s%60).padStart(2,'0')+' s';};
const clock=ms=>{const s=Math.max(0,Math.ceil(ms/1000));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');};
const rnd32=()=>(Math.random()*4294967296)>>>0;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};

/* ---------- modos ---------- */
const MODES={
  livre:{name:'Treino livre',desc:'Você escolhe os tipos, o nível e a quantidade.',fb:'set'},
  rampa:{name:'Rampa progressiva',desc:'Começa fácil e a dificuldade sobe até a última questão.',fb:'set'},
  simulado:{name:'Simulado',desc:'Cronômetro e gabarito só no final, como na prova.',fb:'end'},
  adapt:{name:'Adaptativo',desc:'Sobe de nível a cada 2 acertos seguidos e desce a cada erro. Estima o seu nível.',fb:'set'},
  foco:{name:'Ponto fraco',desc:'Questões montadas nas regras que você mais erra.',fb:'set'}};
const FBTXT={eyeC:'Correta na hora, explicação no olho',eye:'Resposta na hora, escondida no olho',auto:'Resposta na hora',off:'Resposta só no final',end:'Resposta só no final'};
const fbOf=m=>MODES[m].fb==='end'?'end':DB.settings.feedback;
const fbTxt=m=>{const f=fbOf(m);return FBTXT[f==='eye'&&DB.settings.showCorrect?'eyeC':f];};
const SAMPLE={livre:['mat',3,11],rampa:['seq',4,7],simulado:['mat',6,5],adapt:['ana',5,3],foco:['esp',5,9]};

/* ---------- estatísticas ---------- */
function allAnswers(){const out=[];for(const s of DB.sessions)for(const a of s.ans)if(a)out.push(a);return out;}
function keyStats(ans){const m={};for(const a of ans){for(const k of a.keys||[]){m[k]=m[k]||{k,seen:0,err:0};m[k].seen++;}for(const k of a.err||[]){m[k]=m[k]||{k,seen:0,err:0};m[k].err++;if(!(a.keys||[]).includes(k))m[k].seen++;}}
  return Object.values(m).map(o=>Object.assign(o,{rate:o.err/o.seen,score:(o.err+0.5)/(o.seen+2)}));}
function weakKeys(ans,n){return keyStats(ans).filter(o=>o.err>0&&o.k!=='tempo'&&PV.whereKey(o.k).length).sort((a,b)=>b.score-a.score||b.err-a.err).slice(0,n);}
function famStats(ans){return FK.map(f=>{const x=ans.filter(a=>a.fam===f);return{f,n:x.length,ok:x.filter(a=>a.ok).length};});}

/* ---------- sessão ---------- */
const cache=new Map();
function itemOf(s,i){const k=s.id+':'+i;if(!cache.has(k)){const sp=s.items[i];cache.set(k,PV.make(sp.fam,sp.lvl,sp.seed,sp.prefer));}return cache.get(k);}
function famCycle(fams,n){let out=[];while(out.length<n)out=out.concat(shuffle(fams));return out.slice(0,n);}
function newSession(c){
  const s={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),mode:c.mode,created:Date.now(),cfg:c,items:[],ans:[],idx:0,fb:fbOf(c.mode),elapsed:0,n:c.n};
  if(c.mode==='adapt'){s.adapt={lvl:c.lvl,streak:0,hist:[]};s.items.push({fam:shuffle(c.fams)[0],lvl:c.lvl,seed:rnd32()});}
  else if(c.mode==='foco'){const ks=c.keys;for(let i=0;i<c.n;i++){const k=ks[i%ks.length];const w=PV.whereKey(k);const[f,minL]=w[Math.floor(Math.random()*w.length)];
      s.items.push({fam:f,lvl:Math.min(10,Math.max(minL,c.lvl+Math.floor(Math.random()*3)-1)),seed:rnd32(),prefer:[k]});}s.items=shuffle(s.items);}
  else{const fs=famCycle(c.fams,c.n);for(let i=0;i<c.n;i++){const lvl=c.mode==='rampa'?Math.round(c.from+(c.to-c.from)*(c.n>1?i/(c.n-1):0)):c.lvl;s.items.push({fam:fs[i],lvl,seed:rnd32()});}}
  if(c.mode==='simulado')s.limit=c.minutes*60000;
  DB.current=s;save();return s;}

/* ---------- navegação ---------- */
let view='home',viewArg=null,timerId=null,qStart=0,pending=-1,revealed=false,sheetOpen=false;
function go(v,arg){view=v;viewArg=arg;clearInterval(timerId);timerId=null;pending=-1;revealed=false;sheetOpen=false;document.body.classList.toggle('quiz',v==='quiz');document.body.classList.remove('sheet');render();window.scrollTo(0,0);
  document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.go===(v==='quiz'||v==='setup'?'home':v==='result'?'stats':v)));}
function render(){({home:vHome,setup:vSetup,quiz:vQuiz,result:vResult,stats:vStats,settings:vSettings})[view]();}
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),2600);}
function dialog(title,text,btns){const d=$('#dlg');d.innerHTML='<div class="dbox" role="dialog" aria-modal="true"><h3>'+esc(title)+'</h3><p>'+esc(text)+'</p><div class="row end">'+
  btns.map((b,i)=>'<button class="btn '+(b.cls||'')+'" data-i="'+i+'">'+esc(b.t)+'</button>').join('')+'</div></div>';d.hidden=false;
  d.querySelectorAll('button').forEach(el=>el.onclick=()=>{d.hidden=true;const f=btns[+el.dataset.i].fn;if(f)f();});}

/* ---------- INÍCIO ---------- */
function vHome(){
  const cur=DB.current;const ans=allAnswers();const weak=weakKeys(ans,3);
  let h='<section class="hero"><div><h1>Psicotécnico visual</h1><p class="lead">Sequências, matrizes, analogias, rotação e figura intrusa. Cada questão é gerada na hora a partir de regras e verificada por um solucionador: só existe uma resposta certa.</p>'+
    (ans.length?'<p class="meta">'+ans.length+' questões respondidas · '+pct(ans.filter(a=>a.ok).length,ans.length)+'% de acerto'+(DB.est.adapt?' · nível estimado '+DB.est.adapt.toFixed(1).replace('.',','):'')+'</p>':'')+'<p class="meta">'+syncHTML()+'</p>'+
    '</div><div class="heroFig">'+heroFig()+'</div></section>';
  if(cur){const done=cur.ans.filter(a=>a).length;h+='<section class="cont"><div><b>Sessão em andamento</b><span>'+MODES[cur.mode].name+' · '+done+' de '+cur.n+' respondidas</span></div><div class="row"><button class="btn ghost" id="discard">Descartar</button><button class="btn pri" id="resume">Continuar</button></div></section>';}
  h+='<h2 class="sec">Escolha um modo</h2><div class="modes">'+Object.entries(MODES).map(([k,m])=>{const sm=SAMPLE[k];const it=PV.make(sm[0],sm[1],sm[2]);
    const dis=k==='foco'&&!weak.length;
    return '<button class="mode'+(dis?' dis':'')+'" data-mode="'+k+'"'+(dis?' aria-disabled="true"':'')+'><span class="mfig">'+PV.figSVG(it.options[it.answer].fig)+'</span><span class="mtx"><b>'+m.name+'</b><span>'+m.desc+'</span>'+
      '<em class="fb fb-'+fbOf(k)+'">'+eyeIco(fbOf(k)==='eye')+fbTxt(k)+'</em>'+(dis?'<em class="fb">Disponível depois de errar algumas questões</em>':'')+'</span></button>';}).join('')+'</div>';
  if(weak.length)h+='<p class="hint">Seu ponto mais fraco agora: <b>'+esc(PV.keyLabel(weak[0].k))+'</b> ('+weak[0].err+' erros em '+weak[0].seen+').</p>';
  app.innerHTML=h;
  app.querySelectorAll('.mode').forEach(b=>b.onclick=()=>{if(b.classList.contains('dis')){toast('Faça alguns treinos primeiro: o modo usa os seus erros.');return;}go('setup',b.dataset.mode);});
  if(cur){$('#resume').onclick=()=>go('quiz');$('#discard').onclick=()=>dialog('Descartar sessão?','As respostas desta sessão não entram no histórico.',[{t:'Cancelar'},{t:'Descartar',cls:'danger',fn:()=>{DB.current=null;save();go('home');}}]);}
}
function heroFig(){const it=PV.make('mat',4,20261119);const cells=it.stim.figs.map(f=>'<div class="c">'+PV.figSVG(f)+'</div>').join('');
  return '<div class="mgrid">'+cells+'<div class="c q">?</div></div>';}
function eyeIco(open){return '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>'+(open?'':'<path d="M4 4l16 16"/>')+'</svg>';}

/* ---------- CONFIGURAR ---------- */
let SU=null;
function vSetup(){const m=viewArg;const ans=allAnswers();
  if(!SU||SU.mode!==m){const weak=weakKeys(ans,3);SU={mode:m,fams:new Set(FK),lvl:Math.round(DB.est.adapt||3),from:1,to:10,n:m==='rampa'?30:m==='foco'?20:20,minutes:20,keys:new Set(weak.map(w=>w.k)),weak};}
  const chips=(name,vals,cur,fmt,cus)=>{const isC=!vals.includes(cur)||SU['c_'+name];
    return '<div class="chips" data-name="'+name+'">'+vals.map(v=>'<button class="chip'+(v===cur&&!isC?' on':'')+'" data-v="'+v+'">'+(fmt?fmt(v):v)+'</button>').join('')+
    '<button class="chip'+(isC?' on':'')+'" data-custom="'+name+'">Outro</button>'+
    (isC?'<label class="cus"><input type="number" inputmode="numeric" min="'+cus[0]+'" max="'+cus[1]+'" value="'+cur+'" data-cname="'+name+'" aria-label="Valor personalizado"><span>'+cus[2]+'</span></label>':'')+'</div>';};
  const slider=(name,v,label)=>'<label class="fld"><span>'+label+' <b id="v_'+name+'">'+v+'</b></span><input type="range" min="1" max="10" value="'+v+'" data-name="'+name+'"></label>';
  let h='<button class="back" id="back">← Modos</button><h1 class="pg">'+MODES[m].name+'</h1><p class="lead">'+MODES[m].desc+'</p><div class="card form">';
  if(m!=='foco')h+='<div class="fld"><span>Tipos de questão</span><div class="chips multi">'+FK.map(f=>'<button class="chip'+(SU.fams.has(f)?' on':'')+'" data-fam="'+f+'">'+FAMS[f]+'</button>').join('')+'</div></div>';
  else h+='<div class="fld"><span>Regras para treinar</span><div class="chips multi">'+SU.weak.map(w=>'<button class="chip'+(SU.keys.has(w.k)?' on':'')+'" data-key="'+esc(w.k)+'">'+esc(PV.keyLabel(w.k))+' · '+w.err+'/'+w.seen+'</button>').join('')+'</div></div>';
  if(m==='rampa')h+=slider('from',SU.from,'Começa no nível')+slider('to',SU.to,'Termina no nível');
  else h+=slider('lvl',SU.lvl,m==='adapt'?'Nível inicial':m==='foco'?'Nível base':'Nível');
  h+='<div class="fld"><span>Quantidade de questões</span>'+chips('n',m==='rampa'?[20,30,50,100]:m==='adapt'?[20,30,50]:[10,20,30,50,100],SU.n,null,[1,500,'questões (1 a 500)'])+'</div>';
  if(m==='simulado')h+='<div class="fld"><span>Tempo total</span>'+chips('minutes',[10,15,20,30,45,60],SU.minutes,v=>v+' min',[1,240,'minutos'])+'</div>';
  h+='<p class="note">'+eyeIco(fbOf(m)==='eye')+' '+fbTxt(m)+(MODES[m].fb==='set'?' — muda em Ajustes.':'.')+'</p>';
  h+='<button class="btn pri big" id="start">Começar</button></div>';
  app.innerHTML=h;
  $('#back').onclick=()=>go('home');
  app.querySelectorAll('[data-fam]').forEach(b=>b.onclick=()=>{const f=b.dataset.fam;if(SU.fams.has(f)){if(SU.fams.size>1)SU.fams.delete(f);}else SU.fams.add(f);render();});
  app.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>{const k=b.dataset.key;if(SU.keys.has(k)){if(SU.keys.size>1)SU.keys.delete(k);}else SU.keys.add(k);render();});

  app.querySelectorAll('[data-cname]').forEach(i=>{i.oninput=()=>{const v=Math.round(+i.value);if(v>=+i.min&&v<=+i.max)SU[i.dataset.cname]=v;};

    const go2=()=>{newSession(c);go('quiz');};
    if(DB.current)dialog('Substituir sessão?','Há uma sessão em andamento. Começar outra descarta a atual.',[{t:'Cancelar'},{t:'Começar nova',cls:'danger',fn:go2}]);else go2();};
}

/* ---------- QUESTÃO ---------- */
function stimHTML(it){const f=it.stim.figs.map(x=>PV.figSVG(x));
  if(it.stim.type==='seq')return '<div class="stim seq">'+f.map(s=>'<div class="c">'+s+'</div>').join('')+'<div class="c q">?</div></div>';
  if(it.stim.type==='mat')return '<div class="stim mat">'+f.map(s=>'<div class="c">'+s+'</div>').join('')+'<div class="c q">?</div></div>';
  if(it.stim.type==='ana')return '<div class="stim ana"><div class="c"><i>A</i>'+f[0]+'</div><span class="op">:</span><div class="c"><i>B</i>'+f[1]+'</div><span class="op">::</span><div class="c"><i>C</i>'+f[2]+'</div><span class="op">:</span><div class="c q">?</div></div>';

function optsHTML(it,state){return '<div class="opts n'+it.options.length+'">'+it.options.map((o,i)=>{

function chainHTML(ch){if(!ch||!ch.length)return '';

function recapHTML(it,c){const F=it.stim.figs,A=it.options[it.answer].fig,L=it.letters;
  const mini=(f,cls,cap)=>'<figure class="mini '+(cls||'')+'">'+PV.figSVG(f)+(cap?'<figcaption>'+esc(cap)+'</figcaption>':'')+'</figure>';

  else if(ty==='ana')main='<div class="recap ana">'+mini(F[0],'','A')+mini(F[1],'','B')+mini(F[2],'','C')+mini(A,'ans','D')+'</div>';

function explainHTML(it,a,inline){const L=it.letters;const c=a?a.c:-1;
  const head=a?(a.to?'Tempo esgotado.':c<0?'Sem resposta.':a.ok?'Você acertou.':'Você marcou '+L[c]+'.'):'';

  h+='<p class="verd '+(a&&a.ok?'ok':'bad')+'">'+esc(head)+' Correta: <b>'+L[it.answer]+'</b></p>';

  if(a&&!a.ok&&c>=0){const o=it.options[c];const d=o.diag||{lines:[o.why],traps:[]};
    h+='<div class="wrong"><h4 class="xh">Onde '+L[c]+' erra</h4>'+d.lines.map(l=>'<p>'+esc(l)+'</p>').join('')+chainHTML(d.vis)+(d.traps||[]).map(t=>'<p class="trap">'+esc(t)+'</p>').join('')+'</div>';}

function vQuiz(){const s=DB.current;if(!s){go('home');return;}
  if(s.idx>=s.n){finish();return;}

  h+='<div class="qbar">';

  else if(!lock){h+='<span class="muted">'+(pending<0?'Escolha uma alternativa':'Marcou '+it.letters[pending]+'. Pode trocar.')+'</span><button class="btn pri" id="conf"'+(pending<0?' disabled':'')+'>Confirmar</button>';}
  else{h+=(s.fb==='off'?'<span class="muted">Resposta registrada.</span>':'<button class="btn ghost eye" id="eye">'+eyeIco(true)+(openSheet?'Fechar explicação':showFb?'Abrir explicação':'Ver explicação')+'</button>')+
      '<button class="btn pri" id="next">'+(!last?'Avançar →':'Ver resultado')+'</button>';}
  h+='</div>';

  if(sim)h+='<div class="pal" id="palBox" hidden>'+s.items.map((_,j)=>'<button class="'+(s.ans[j]&&s.ans[j].c>=0?'done':'')+(j===i?' cur':'')+'" data-j="'+j+'">'+(j+1)+'</button>').join('')+'</div>';
  app.innerHTML=h;
  qStart=performance.now();
  $('#quit').onclick=()=>dialog('Encerrar agora?',sim?'O simulado será corrigido com o que você respondeu até aqui.':'As questões respondidas entram no resultado; as restantes ficam de fora.',[{t:'Continuar'},{t:'Encerrar',cls:'danger',fn:()=>finish(true)}]);
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(+b.dataset.i));
  const adv=()=>{s.idx++;save();go('quiz');};
  if(sim){$('#prev').onclick=()=>move(-1);if($('#next'))$('#next').onclick=()=>move(1);if($('#fin'))$('#fin').onclick=askFinish;
    $('#pal').onclick=()=>{const p=$('#palBox');p.hidden=!p.hidden;if(!p.hidden)p.scrollIntoView({block:'nearest'});};app.querySelectorAll('#palBox button').forEach(b=>b.onclick=()=>{addTime();s.idx=+b.dataset.j;save();go('quiz');});}
  else if(lock){$('#next').onclick=adv;if($('#next2'))$('#next2').onclick=adv;
    const setSheet=v=>{revealed=true;sheetOpen=v;const y=window.scrollY;render();window.scrollTo(0,y);const e=$('#exp');if(e)e.scrollTop=0;};
    if($('#eye'))$('#eye').onclick=()=>setSheet(!sheetOpen);
    if($('#hideExp'))$('#hideExp').onclick=()=>setSheet(false);
    if($('#scrim'))$('#scrim').onclick=()=>setSheet(false);}
  else $('#conf').onclick=()=>{if(pending>=0)lockAnswer(pending,false);};
  if(!lock)startTimer();else{clearInterval(timerId);const tm=$('#tm');if(tm&&!sim)tm.textContent=clock(a.ms);}
}
function startTimer(){const s=DB.current,sim=s.mode==='simulado',lim=DB.settings.qTime*1000;clearInterval(timerId);
  const prev=(s.ans[s.idx]&&s.ans[s.idx].ms)||0;
  const tick=()=>{const tm=$('#tm');const el=performance.now()-qStart;
    if(sim){const left=s.limit-(s.elapsed+el);if(tm){tm.textContent=clock(left);tm.classList.toggle('warn',left<60000);}if(left<=0){addTime();finish(true,'Tempo do simulado esgotado.');}return;}
    if(lim){const left=lim-el;if(tm){tm.textContent=clock(left);tm.classList.toggle('warn',left<10000);}if(left<=0)lockAnswer(pending>=0?pending:-1,pending<0);}
    else if(tm)tm.textContent=clock(prev+el);};
  tick();timerId=setInterval(tick,250);}
function addTime(){const s=DB.current;if(!s||s.mode!=='simulado')return;const el=performance.now()-qStart;s.elapsed+=el;const i=s.idx;
  if(s.ans[i])s.ans[i].ms+=el;else s.ans[i]=rec(s,i,-1,el);qStart=performance.now();}
function rec(s,i,c,ms,to){const it=itemOf(s,i);const ok=c===it.answer;
  return{c,ok,ms,to:!!to,fam:it.fam,lvl:it.lvl,keys:it.keys,err:ok?[]:(c>=0?it.options[c].errs:(to?['tempo']:[]))};}
function pick(i){const s=DB.current;
  if(s.mode==='simulado'){const a=s.ans[s.idx];const ms=a?a.ms:0;s.ans[s.idx]=rec(s,s.idx,i,ms);save();
    haptic('selection');app.querySelectorAll('.opt').forEach(b=>b.classList.toggle('sel',+b.dataset.i===i));return;}
  if(s.ans[s.idx])return;
  if(pending!==i)haptic('selection');pending=i;app.querySelectorAll('.opt').forEach(b=>b.classList.toggle('sel',+b.dataset.i===i));
  const c=$('#conf');c.disabled=false;const m=app.querySelector('.qbar .muted');if(m)m.textContent='Marcou '+itemOf(s,s.idx).letters[i]+'. Pode trocar.';}
function lockAnswer(c,to){const s=DB.current;if(s.ans[s.idx])return;clearInterval(timerId);
  const ms=performance.now()-qStart;const a=rec(s,s.idx,c,ms,to);s.ans[s.idx]=a;pending=-1;
  if(s.mode==='adapt'){const A=s.adapt;A.hist.push(s.items[s.idx].lvl);if(a.ok){A.streak++;if(A.streak>=2){A.lvl=Math.min(10,A.lvl+1);A.streak=0;}}else{A.lvl=Math.max(1,A.lvl-1);A.streak=0;}}
  save();revealed=false;sheetOpen=s.fb==='auto';
  haptic((s.fb==='auto'||(s.fb==='eye'&&DB.settings.showCorrect))?(a.ok?'success':'error'):'light');
  const y=window.scrollY;render();window.scrollTo(0,y);}
function move(d){const s=DB.current;addTime();s.idx=Math.max(0,Math.min(s.n-1,s.idx+d));save();go('quiz');}
function askFinish(){const s=DB.current;const blank=s.n-s.ans.filter(a=>a&&a.c>=0).length;
  if(blank)dialog('Finalizar o simulado?',blank+' '+(blank===1?'questão está':'questões estão')+' sem resposta e '+(blank===1?'contará':'contarão')+' como erro.',[{t:'Voltar'},{t:'Finalizar',cls:'pri',fn:()=>{addTime();finish(true);}}]);
  else{addTime();finish(true);}}
function finish(early,msg){const s=DB.current;if(!s)return;clearInterval(timerId);
  if(s.mode==='simulado'){for(let i=0;i<s.n;i++)if(!s.ans[i])s.ans[i]=rec(s,i,-1,0);}
  else if(early){const k=s.ans.filter(a=>a).length;s.items=s.items.slice(0,k);s.ans=s.ans.slice(0,k);s.n=k;}
  else s.items=s.items.slice(0,s.n);
  if(s.mode==='adapt'&&s.adapt.hist.length){const h=s.adapt.hist.slice(-8).concat([s.adapt.lvl]);s.est=h.reduce((x,y)=>x+y,0)/h.length;DB.est.adapt=s.est;}
  s.done=Date.now();DB.current=null;
  if(s.n>0){DB.sessions.push(s);saveSession(s);if(DB.sessions.length>300){DB.sessions.slice(0,DB.sessions.length-300).forEach(x=>dropSession(x.id));DB.sessions=DB.sessions.slice(-300);}}
  save();if(msg)toast(msg);if(s.n>0)go('result',s.id);else go('home');}
