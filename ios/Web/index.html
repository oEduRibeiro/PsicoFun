    '<div class="fld"><span>Tempo limite por questão (treino)</span><div class="chips" data-name="qTime">'+[[0,'Sem limite'],[30,'30 s'],[60,'60 s'],[90,'90 s']].map(([v,t])=>'<button class="chip'+(st.qTime===v?' on':'')+'" data-v="'+v+'">'+t+'</button>').join('')+'</div></div></section>';
  h+='<section class="card"><h2>Seus dados</h2><p class="muted small">'+syncHTML()+' · '+DB.sessions.length+' sessões guardadas. '+(SYNC==='device'?'Para levar o histórico para outro aparelho, exporte o backup e restaure lá.':SYNC==='ok'?'O histórico acompanha você em qualquer aparelho em que abrir este artifact logado.':'Abra pelo Claude, logado, para salvar na conta. Enquanto isso, copie o backup de vez em quando.')+'</p>'+
    '<div class="row wrap"><button class="btn ghost" id="exp">'+(NATIVE?'Exportar backup':'Copiar backup')+'</button><button class="btn ghost" id="imp">Restaurar backup</button><button class="btn danger" id="clr">Apagar histórico</button></div>'+
    '<div id="ioBox" hidden><textarea id="io" rows="5" spellcheck="false"></textarea><div class="row wrap"><label class="btn ghost file">Abrir arquivo .json<input type="file" accept=".json,application/json" id="fileIn"></label><button class="btn pri" id="doImp">Restaurar</button></div></div></section>';
  h+='<section class="card"><details><summary>Como as questões são feitas</summary><p>Cada questão nasce de regras, não de desenho livre: o gerador sorteia atributos (forma, quantidade, tamanho, preenchimento, rotação, posição, linhas) e regras para eles (progressão, alternância, ciclo, distribuição de três, soma, subtração, união e diferença de linhas), no modelo das matrizes de Raven.</p><p>Antes de aparecer, um solucionador separado tenta todas as regras possíveis em cada atributo. Se mais de uma resposta for defensável, a questão é descartada. As alternativas erradas mudam um ou mais atributos de forma equilibrada, para que a correta não se destaque por “ser a mais parecida com as outras”. Cada alternativa errada guarda qual regra ela viola — é assim que o relatório sabe o que você mais erra.</p><p>A mesma semente gera sempre a mesma questão, por isso a revisão de sessões antigas mostra exatamente o que você viu.</p></details></section>';
  app.innerHTML=h;
  app.querySelectorAll('input[type=radio]').forEach(r=>r.onchange=()=>{st[r.name]=r.value;DB._localSettingsTouched=1;save();haptic('selection');const y=window.scrollY;render();window.scrollTo(0,y);toast('Ajuste salvo');});
  app.querySelectorAll('.tog input').forEach(r=>r.onchange=()=>{st[r.dataset.name]=r.checked;DB._localSettingsTouched=1;save();haptic('selection');toast('Ajuste salvo');});
  app.querySelectorAll('.chips[data-name] .chip').forEach(b=>b.onclick=()=>{st.qTime=+b.dataset.v;save();render();toast('Ajuste salvo');});
  $('#exp').onclick=async()=>{const txt=JSON.stringify({v:1,settings:DB.settings,sessions:DB.sessions,est:DB.est});
    if(NATIVE){native('share',txt);return;}$('#ioBox').hidden=false;$('#io').value=txt;
    try{await navigator.clipboard.writeText(txt);toast('Backup copiado. Cole num arquivo ou nota.');}catch(e){$('#io').select();toast('Selecione o texto e copie.');}};
  $('#imp').onclick=()=>{$('#ioBox').hidden=false;$('#io').value='';$('#io').focus();};
  $('#fileIn').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('#io').value=r.result;};r.readAsText(f);};
  $('#doImp').onclick=()=>{try{const d=JSON.parse($('#io').value);if(!d||!Array.isArray(d.sessions))throw 0;
      dialog('Restaurar backup?','O histórico atual ('+DB.sessions.length+' sessões) será substituído por '+d.sessions.length+' sessões do backup.',[{t:'Cancelar'},{t:'Restaurar',cls:'pri',fn:()=>{DB.sessions.forEach(x=>dropSession(x.id));DB.sessions=d.sessions;DB.est=d.est||{};DB.settings=Object.assign({},DEF,d.settings);save();DB.sessions.forEach(saveSession);toast('Backup restaurado');go('stats');}}]);}
    catch(e){toast('Esse texto não é um backup válido.');}};
  $('#clr').onclick=()=>dialog('Apagar todo o histórico?','Sessões, estatísticas e nível estimado serão apagados deste navegador. Os ajustes continuam.',[{t:'Cancelar'},{t:'Apagar',cls:'danger',fn:()=>{DB.sessions.forEach(x=>dropSession(x.id));DB.sessions=[];DB.est={};DB.current=null;save();toast('Histórico apagado');render();}}]);}

/* ---------- teclado ---------- */
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#hideExp')){$('#hideExp').click();return;}if(view!=='quiz'||!$('#dlg').hidden||e.target.matches('input,textarea'))return;
  const k=e.key.toUpperCase();const idx='ABCDEFGH'.indexOf(k)>=0?'ABCDEFGH'.indexOf(k):(/^[1-8]$/.test(k)?+k-1:-1);
  const n=app.querySelectorAll('.opt').length;if(idx>=0&&idx<n){const b=app.querySelector('.opt[data-i="'+idx+'"]');if(b&&b.getAttribute('aria-disabled')!=='true')b.click();}
  else if(e.key==='Enter'){const b=$('#conf:not([disabled])')||$('#next')||$('#fin');if(b){e.preventDefault();b.click();}}
  else if(k==='V'&&($('#eye')||$('#hideExp')))($('#eye')||$('#hideExp')).click();});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&view==='quiz'&&DB.current&&DB.current.mode==='simulado'){addTime();save();}});


/* ---------- gestos iOS ---------- */
const BACK={setup:()=>go('home'),result:()=>go('stats')};
let tg=null;
document.addEventListener('touchstart',e=>{const t=e.touches[0];if(e.touches.length!==1){tg=null;return;}
  const head=e.target.closest&&e.target.closest('.exp.sheet .sheethead');
  if(head&&!e.target.closest('button')){tg={k:'sheet',y:t.clientY,el:$('#exp'),dy:0};tg.el.classList.add('drag');return;}
  if(t.clientX<24&&BACK[view]&&$('#dlg').hidden){tg={k:'edge',x:t.clientX,y:t.clientY};return;}
  tg=null;},{passive:true});
document.addEventListener('touchmove',e=>{if(!tg)return;const t=e.touches[0];
  if(tg.k==='sheet'){tg.dy=Math.max(0,t.clientY-tg.y);tg.el.style.transform='translateY('+tg.dy+'px)';}
  else{tg.dx=t.clientX-tg.x;tg.ady=Math.abs(t.clientY-tg.y);app.style.transform=tg.dx>0&&tg.ady<60?'translateX('+Math.min(tg.dx,120)/3+'px)':'';}},{passive:true});
document.addEventListener('touchend',()=>{if(!tg)return;const g=tg;tg=null;
  if(g.k==='sheet'){g.el.classList.remove('drag');if(g.dy>90){haptic('light');$('#hideExp').click();}else{g.el.classList.add('snap');g.el.style.transform='';setTimeout(()=>g.el.classList.remove('snap'),220);}return;}
  app.style.transform='';if(g.dx>70&&g.ady<60&&BACK[view]){haptic('light');BACK[view]();}});
document.addEventListener('touchcancel',()=>{if(tg&&tg.el){tg.el.classList.remove('drag');tg.el.style.transform='';}app.style.transform='';tg=null;});
window.PF_back=()=>{if(!$('#dlg').hidden){$('#dlg').hidden=true;return true;}if($('#hideExp')){$('#hideExp').click();return true;}if(BACK[view]){BACK[view]();return true;}return false;};
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{if(!b.classList.contains('on'))haptic('selection');if(view==='quiz'&&DB.current&&DB.current.mode==='simulado')addTime();go(b.dataset.go);});
go('home');initRemote();
}
</script>
</body>
</html>
