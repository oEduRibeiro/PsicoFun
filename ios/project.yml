name: PsicoFun
options:
  bundleIdPrefix: com.oeduribeiro
  deploymentTarget:
    iOS: "16.1"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  PsicoFun:
    type: application
    platform: iOS
    sources:
      - path: PsicoFun
      - path: Shared
      # Motor de geração de questões (lógica pura, roda no JavaScriptCore; a interface é SwiftUI).
      - path: Engine
        type: folder
        buildPhase: resources
    dependencies:
      - target: PalograficoWidget
        embed: true
        codeSign: false
    info:
      path: PsicoFun/Info.plist
      properties:
        CFBundleDisplayName: PsicoFun
        CFBundleName: $(PRODUCT_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundlePackageType: APPL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: pt-BR
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIStatusBarStyle: UIStatusBarStyleDefault
        UIViewControllerBasedStatusBarAppearance: true
        UIRequiresFullScreen: false
        # Palográfico: bips/vibração com a tela bloqueada e Live Activity.
        UIBackgroundModes:
          - audio
        NSSupportsLiveActivities: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_NAME: PsicoFun
        PRODUCT_BUNDLE_IDENTIFIER: com.oeduribeiro.psicofun
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        DEVELOPMENT_TEAM: ""

  # Live Activity / Dynamic Island do modo Palográfico.
  PalograficoWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: PalograficoWidget
      - path: Shared
    info:
      path: PalograficoWidget/Info.plist
      properties:
        CFBundleDisplayName: PsicoFun Palográfico
        CFBundleName: $(PRODUCT_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundlePackageType: XPC!
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: pt-BR
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_NAME: PalograficoWidget
        PRODUCT_BUNDLE_IDENTIFIER: com.oeduribeiro.psicofun.PalograficoWidget
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        DEVELOPMENT_TEAM: ""
